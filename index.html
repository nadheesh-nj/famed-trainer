<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaMed Trainer – Anamnese & Aufklärung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, clinical exam console – serious but encouraging
   IDEA: a telemedicine consultation window, like the real FaMed video call
   PICTURE: the patient on a webcam tile, mouth moving when they speak, timer above
   COLOUR and TYPE: white + deep clinical teal, coral only for time running out; Inter Tight / Inter
   LAYOUT: case list on the left, the call fills the rest; stacks on phones */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d1416);--ink:light-dark(#11191b,#e6eeef);--mute:light-dark(#5b6b6e,#93a5a8);
--panel:light-dark(#f1f6f6,#152124);--line:light-dark(#d8e3e3,#24353a);
--teal:light-dark(#0b5d63,#57b6bc);--tealbg:light-dark(#0b5d63,#0f3a3e);--onteal:#f2fbfb;
--coral:#e5533d;--ok:light-dark(#1f7a4d,#5cc98f);--mid:light-dark(#a86a00,#e2b04a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;line-height:1.08;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{background:var(--tealbg);color:var(--onteal);padding:22px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font:700 21px/1.1 "Inter Tight",sans-serif;padding:0 8px}
.brand small{display:block;font:500 13px Inter;opacity:.75;margin-top:4px}
.sec{font-size:13px;opacity:.7;margin:10px 8px 2px}
.tbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:10px;background:transparent;color:inherit;text-align:left}
.tbtn:hover{background:rgba(255,255,255,.09)}.tbtn.on{background:rgba(255,255,255,.18)}
.tnum{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font:600 13px Inter}
.tt{flex:1;font-size:15px;line-height:1.25}.tt small{display:block;opacity:.65;font-size:13px}
.best{flex:none;font:600 13px Inter;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.16)}
.rnd{border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:10px;min-height:44px}
.rnd:hover{background:rgba(255,255,255,.09)}
.role{display:flex;gap:6px;padding:0 4px;margin-top:auto}
.role button{flex:1;min-height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit;font-size:14px}
.role button.on{background:var(--onteal);color:var(--tealbg)}
main{padding:clamp(18px,3vw,40px);max-width:1240px;width:100%}
.lead{color:var(--mute);max-width:62ch}
.btn{border:0;border-radius:10px;min-height:46px;padding:10px 20px;background:var(--teal);color:var(--bg);font-weight:600}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.danger{background:var(--coral);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
/* home */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:26px 0}
.step{background:var(--panel);border-radius:14px;padding:18px}
.steps.s4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:1100px){.steps.s4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step b{display:block;font:700 30px/1 "Inter Tight";color:var(--teal);margin-bottom:8px}
.caps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 24px}
.cap{font-size:14px;padding:5px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.cap.y::before{content:"● ";color:var(--ok)}.cap.n::before{content:"● ";color:var(--coral)}
.fl{display:block;font-size:14px;font-weight:600;margin-top:10px}.fl input,.fl select{display:block;width:100%;margin-top:5px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px;font:16px Inter}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:600px){.two{grid-template-columns:minmax(0,1fr)}}
.sm{min-height:38px;padding:6px 14px;font-size:14px;margin-top:10px}.trout{white-space:pre-line;font-size:15px;margin-top:8px;color:var(--ink);border-left:3px solid var(--teal);padding-left:10px}.trout:empty{display:none}
.en{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--bg);font-size:15px;color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(5,20,22,.55);display:grid;place-items:center;padding:16px;z-index:50}
.mcard{background:var(--bg);color:var(--ink);border-radius:18px;padding:clamp(20px,3vw,32px);width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.hint.warn{color:var(--coral);font-weight:600;font-size:15px}
.mic.wait{opacity:.45}.mic,.self{transition:background .25s,box-shadow .25s,opacity .25s}
.mic.muted{background:var(--line);color:var(--mute)}
.lvlrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;margin:14px 0 24px}
.lvl{width:130px;height:130px;border:6px solid;border-radius:22px;display:grid;place-items:center;align-content:center;text-align:center;gap:2px}
.lvl b{font:700 52px/1 "Inter Tight",sans-serif}.lvl small{font-size:13px;color:var(--mute)}
.judge h3{font-size:21px}.judge .op{margin:0 0 10px;font-size:15px}
.item{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.item:last-child{border:0}
.mis,.sol{display:flex;gap:8px}.mis span{color:var(--coral);font-weight:700}.sol{margin-top:4px;color:var(--ok)}.sol span{font-weight:700}
@media(max-width:600px){.lvlrow{grid-template-columns:minmax(0,1fr)}}
@media print{aside,.acts,.hint,#modal{display:none!important}.app{display:block}main{padding:0;max-width:none}body{background:#fff;color:#000}details{display:block}details>*{display:block}.card{break-inside:avoid}}
.sheet{font-size:15px;line-height:1.5}.sheet p{margin:2px 0 10px}.sheet ol{padding-left:20px;margin:4px 0}.sheet ol li{margin:4px 0}
.sh-k{font-weight:700;color:var(--teal);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin-top:10px}
.shi{border-collapse:collapse;width:100%;margin:4px 0 6px}.shi td{vertical-align:top;padding:4px 10px 4px 0;border-bottom:1px solid var(--line)}.shi td:first-child{color:var(--mute);white-space:nowrap;width:1%}
#pa .sheet{font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 20px}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border-radius:14px;padding:14px 16px}.kpi small{display:block;color:var(--mute);font-size:13px}.kpi b{font:700 32px/1.1 "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;border-radius:6px}
.crit{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}.crit:last-child{border:0}.crit .pbar{margin:0}.crit em{grid-column:1/-1;font-style:normal;color:var(--mute);font-size:13.5px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:0 7px;border-radius:10px;background:var(--line);color:var(--ink);margin-right:6px;vertical-align:1px}
aside details.grp{background:transparent;padding:0;margin:2px 0;border-radius:0}
aside details.grp>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:42px;padding:6px 10px;border-radius:10px;font:600 15px Inter;color:var(--onteal);cursor:pointer}
aside details.grp>summary::-webkit-details-marker{display:none}
aside details.grp>summary::before{content:"▸";margin-right:2px;transition:transform .15s}aside details.grp[open]>summary::before{transform:rotate(90deg)}
aside details.grp>summary span{margin-left:auto;font:600 12px Inter;opacity:.7;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:10px}
aside details.grp>summary:hover{background:rgba(255,255,255,.09)}
aside .glist{padding:2px 0 8px 6px}
.hist{width:100%;border-collapse:collapse;font-size:15px}.hist td,.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.hist .r{text-align:right;white-space:nowrap}
/* reading */
.task{max-width:720px;margin:6vh auto 0;background:var(--panel);border-radius:18px;padding:clamp(22px,4vw,40px);border-top:6px solid var(--teal)}
.count{font:700 clamp(54px,9vw,88px)/1 "Inter Tight";color:var(--teal);margin:18px 0 6px;font-variant-numeric:tabular-nums}
/* call */
.call{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#1b2729;aspect-ratio:16/10;box-shadow:0 18px 40px -22px rgba(0,0,0,.5)}
.stage svg.av{position:absolute;inset:0;width:100%;height:100%}
.bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(rgba(0,0,0,.55),transparent);color:#fff;font-size:14px}
.rec::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--coral);margin-right:7px;vertical-align:1px}
.timer{font:700 22px/1 "Inter Tight";font-variant-numeric:tabular-nums;background:rgba(0,0,0,.45);padding:7px 12px;border-radius:10px;color:#fff}
.timer.low{background:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.self{position:absolute;right:14px;bottom:14px;width:22%;aspect-ratio:4/3;border-radius:10px;background:#2c3c3f;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#cfe;font:600 14px Inter}
.self.live{border-color:#7fe3a8}
.cc{position:absolute;left:5%;right:28%;bottom:16px;color:#fff;font-size:17px;line-height:1.4;text-shadow:0 1px 3px #000}
.cc span{background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.status{position:absolute;left:14px;top:52px;color:#fff;font-size:13px;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:20px}
.controls{display:flex;gap:10px;align-items:stretch;margin-top:14px;flex-wrap:wrap}
.mic{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--teal);color:var(--bg);display:grid;place-items:center}
.mic.on{background:var(--coral);color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--coral) 30%,transparent)}
.mic svg{width:26px;height:26px}
.say{flex:1 1 260px;display:flex;gap:8px}
.say textarea{flex:1;resize:none;min-height:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;font:16px/1.4 Inter}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
.side{display:flex;flex-direction:column;background:var(--panel);border-radius:16px;overflow:hidden;min-height:420px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:46px;border:0;background:transparent;color:var(--mute);font-weight:600;font-size:15px}
.tabs button.on{color:var(--teal);box-shadow:inset 0 -3px 0 var(--teal)}
.pane{flex:1;display:none;padding:12px;overflow-y:auto;max-height:62vh}.pane.on{display:block}
#notes{width:100%;height:100%;min-height:380px;border:0;background:transparent;color:var(--ink);font:15px/1.6 Inter;resize:none;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 24px;line-height:24px}
.msg{margin:0 0 10px;font-size:15px}.msg b{display:block;font-size:13px;color:var(--mute)}
.msg.doc b{color:var(--teal)}
/* feedback */
.fhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;margin-bottom:26px}
.ring{width:150px;height:150px}
.vd{display:inline-block;font-weight:600;padding:3px 12px;border-radius:20px;margin-bottom:10px;color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--panel);border-radius:14px;padding:18px 20px}
.card h3{font-size:19px;margin-bottom:12px}
.row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}.row:last-child{border:0}
.chip{flex:none;font-size:13px;font-weight:600;padding:1px 9px;border-radius:12px;height:fit-content;color:#fff}
.c-ok{background:var(--ok)}.c-teilweise{background:var(--mid)}.c-fehlt{background:var(--coral)}
.fix{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.fix:last-child{border:0}
.fix s{color:var(--coral)}.fix ins{text-decoration:none;color:var(--ok);font-weight:600;display:block}
.fix small{color:var(--mute)}
ul.clean{margin:0;padding-left:20px}ul.clean li{margin:4px 0}
details{background:var(--panel);border-radius:14px;padding:14px 20px;margin-top:18px}
summary{cursor:pointer;font-weight:600;min-height:28px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--teal);animation:rot 1s linear infinite;margin:40px auto 14px}
@keyframes rot{to{transform:rotate(360deg)}}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
/* avatar animation */
.av .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.av .head{transform-origin:240px 330px;animation:sway 7s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.2deg) translateY(1px)}}
.av .m-open{opacity:0;transform-box:fill-box;transform-origin:center}
.av.talking .m-open{opacity:1;animation:talk .17s infinite alternate}
.av.talking .m-closed{opacity:0}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.av .eyes,.av .head,.av.talking .m-open,.timer.low,.spin{animation:none}}
@media(max-width:980px){.call{grid-template-columns:minmax(0,1fr)}.side{min-height:260px}.pane{max-height:40vh}#notes{min-height:220px}}
@media(max-width:760px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{position:static;height:auto;padding:14px 12px;gap:8px}
 #nav .glist{display:flex;flex-wrap:wrap;gap:6px}
 .tbtn{flex:none;width:auto;background:rgba(255,255,255,.08)}
 .tt small,.best{display:none}
 .role{margin-top:4px}
 .steps,.steps.s4,.grid2{grid-template-columns:minmax(0,1fr)}
 .fhead{grid-template-columns:minmax(0,1fr)}
 .cc{right:30%;bottom:10px;font-size:14px}
 .self{width:24%;bottom:10px;right:10px}
 .bar{font-size:12px}
}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="brand">FaMed Trainer<small>Station A · Arzt-Patient</small></div>
 <div class="role lang" aria-label="Sprache / Language" style="margin:0"><button data-l="de">Deutsch</button><button data-l="en">English</button></div>
 <button class="rnd go" id="rand">▶ Test starten</button>
 <nav id="nav" aria-label="Fälle"></nav>
 <button class="rnd" id="gear" style="margin-top:auto">⚙ Einstellungen</button>
 <div class="role" aria-label="Ich bin" style="margin-top:6px"><button data-r="m">Arzt</button><button data-r="f">Ärztin</button></div>
</aside>
<main id="main"></main>
</div>
<script>
const SECTIONS=[
 {id:'krebs',name:'Krebs-Anamnese'},
 {id:'neuro',name:'Neurologische Anamnese'},
 {id:'unfall',name:'Unfall-Anamnese'},
 {id:'hals',name:'Hals / Infekt / Fatigue'},
 {id:'schmerz',name:'Schmerz-Anamnese'}
];

const TOPICS={
 kolon:['Seit wann Bauchschmerzen?','Plötzlich oder schrittweise?','Lokalisation (zeigen lassen)','Ausstrahlung','Charakter (dumpf, drückend, krampfartig)','Schmerzskala 1–10','Verlauf (besser/schlechter)','Auslöser / was verstärkt oder lindert','Medikamente dagegen?','Übelkeit / Erbrechen, Aussehen des Erbrochenen','Stuhlgang: Verstopfung, Durchfall, Teerstuhl, Blut im Stuhl','Wasserlassen','Fieber, Schüttelfrost, Nachtschweiß','Appetit','Ungewollter Gewichtsverlust (6 Monate)','Schlaf','Frühere Darmspiegelung / Vorsorge'],
 bronchial:['Seit wann Husten?','Plötzlich oder schrittweise?','Trocken oder mit Auswurf?','Auswurf: Farbe, Konsistenz','Blut im Auswurf: wie oft, wie viel','Heiserkeit / Stimmveränderung','Atemnot: wann (Belastung, Ruhe, nachts)','Brustschmerzen / Engegefühl + Schmerzanamnese','Kürzliche Atemwegsinfektion / COVID-Kontakt','Übelkeit','Schwindel, Müdigkeit, Leistungsschwäche','Fieber, Schüttelfrost, Nachtschweiß','Appetit','Ungewollter Gewichtsverlust','Stuhlgang / Wasserlassen','Berufliche Exposition (z. B. Asbest)'],
 oesophagus:['Seit wann Schluckbeschwerden?','Plötzlich oder schrittweise?','Nur feste oder auch flüssige Nahrung?','Schmerzen beim Schlucken + Schmerzanamnese','Verlauf','Vermehrter Speichel','Hochkommen von Nahrung (Regurgitation)','Kloßgefühl / geschwollener Hals','Heiserkeit','Schmerzen hinter dem Brustbein','Nächtlicher trockener Husten','Sodbrennen / saures Aufstoßen','Blähungen / Völlegefühl','Übelkeit, Erbrechen, Aussehen','Stuhlgang (Teerstuhl, Blut)','Fieber, Nachtschweiß','Appetit / ungewollter Gewichtsverlust','Schlaf'],
 migraene:['Lokalisation: einseitig, beidseitig, wie ein Band?','Seit wann?','Plötzlich oder schrittweise?','Charakter (pulsierend, drückend, stechend)','Schmerzskala 1–10','Ausstrahlung (Nacken, hinter die Augen)','Häufigkeit und Dauer der Attacken','Auslöser / was verstärkt oder lindert','Verschlimmerung durch körperliche Aktivität','Licht- / Lärmempfindlichkeit','Übelkeit / Erbrechen','Sehstörungen, Flimmern, Lichtblitze (Aura)','Augentränen / Augenrötung','Neurologische Symptome (Lähmung, Taubheit, Sprechen)','Fieber / Nackensteifigkeit','Kopfverletzung','Früher ähnliche Schmerzen?','Medikamente dagegen?'],
 vertigo:['Seit wann Schwindel?','Dreh- oder Schwankschwindel?','Häufigkeit und Dauer der Episoden','Anfallsartig oder dauerhaft?','Auslöser: Lagewechsel, Kopfdrehen, Hinlegen','Übelkeit, Augenzittern, Sehstörungen','Hörminderung','Druckgefühl im Ohr','Ohrgeräusche: seit wann, ein-/beidseitig','Tinnitus: Lautstärke, Klang, pulsierend?','Verlauf des Tinnitus','Neurologische Symptome (Lähmung, Taubheit, Sprechen)','Kopfschmerzen','Angst-, Schlaf-, Konzentrationsstörungen'],
 knie:['Unfallhergang (wann, wo, wie)','Sturz? Auf welche Seite?','Helm / angeschnallt?','Wie ins Krankenhaus / in die Praxis gekommen?','Kopfverletzung, Schwindel, Bewusstlosigkeit','Lokalisation im Knie (vorne, innen, außen, hinten)','Schmerzskala, Charakter, Ausstrahlung','Knie strecken / beugen möglich?','Belastung möglich / gehen?','Instabilitätsgefühl','Knacken oder Knirschen beim Unfall','Sichtbare Fehlstellung','Taubheit / Kribbeln im Bein oder Fuß','Schwellung, Rötung, Überwärmung (sofort oder später?)','Abschürfungen / andere Verletzungen','Frühere Verletzungen am Gelenk','Tetanusschutz (letzte 10 Jahre)'],

{id:'kolon',sec:'krebs',topic:'kolon',close:'bauch',title:'Kolonkarzinom',dx:'V. a. Kolonkarzinom (B-Symptomatik, veränderte Stuhlgewohnheiten, Hämatochezie, positive Familienanamnese)',

 look:{skin:'#e9c3a6',hair:'#a7a7a3',style:'short',shirt:'#5a6b7d',glasses:true,beard:false},
 story:`Klaus Becker, 64 Jahre, geboren am 12.05.1962. 1,78 m, 84 kg (vor einem halben Jahr 91 kg). Hausarzt: Dr. Lange.
HAUPTBESCHWERDE: Seit ca. 3 Monaten Bauchschmerzen im linken Unterbauch. Schleichend angefangen. Dumpf, manchmal krampfartig. Ca. 5 von 10. Keine Ausstrahlung. Schlimmer nach dem Essen, nach dem Stuhlgang kurz besser. Wird langsam schlimmer. Ibuprofen 400 mg ab und zu, hilft kaum.
STUHLGANG: Seit ca. 3 Monaten Wechsel zwischen Verstopfung und Durchfall (früher ganz regelmäßig). In den letzten 4 Wochen zweimal Blut im Stuhl gesehen, dunkelrot, auf dem Stuhl. Stuhl manchmal ganz dünn, "wie ein Bleistift". Kein schwarzer Stuhl.
VEGETATIV: Leichte Übelkeit, kein Erbrechen. Appetit deutlich weniger. 7 kg ungewollt abgenommen in 6 Monaten. Manchmal nachts verschwitzt. Kein Fieber. Sehr müde, schlapp. Schläft schlecht, weil er sich Sorgen macht. Wasserlassen normal. Kein Schwindel.
DARMSPIEGELUNG: Noch nie gemacht, "hatte Angst davor".
VORERKRANKUNGEN: Bluthochdruck seit 10 Jahren. Diabetes Typ 2 seit 5 Jahren.
OPERATIONEN: Blinddarm-OP mit 20. Leistenbruch-OP rechts 2015, ohne Komplikationen.
MEDIKAMENTE: Ramipril 5 mg morgens, Metformin 1000 mg morgens und abends.
ALLERGIEN: Penicillin (Hautausschlag).
IMPFUNGEN: Weiß nicht genau, Impfpass nicht dabei.
NOXEN: Raucht seit 40 Jahren ca. 20 Zigaretten am Tag. Trinkt jeden Abend 2–3 Flaschen Bier. Keine Drogen.
FAMILIE: Vater mit 70 an Darmkrebs gestorben. Mutter lebt, 88, Herzschwäche. Ein Bruder, gesund.
SOZIAL: Verheiratet, 2 erwachsene Kinder (gesund). Wohnt mit Ehefrau im eigenen Haus in Kassel. LKW-Fahrer, geht nächstes Jahr in Rente.
PSYCHE: Macht sich große Sorgen wegen seines Vaters.`,
 cues:`1) Sobald es um das Blut im Stuhl oder die Familie geht, sagst du besorgt: "Mein Vater hatte Darmkrebs... Habe ich das jetzt auch?"
2) Wenn der Arzt nach dem Rauchen fragt und es kritisiert, sagst du etwas genervt, dass du es schon oft versucht hast aufzuhören.
3) Am Ende fragst du: "Muss ich jetzt eine Darmspiegelung machen? Tut das weh?"`},

{id:'bronchial',sec:'krebs',topic:'bronchial',close:'thorax',title:'Bronchialkarzinom',dx:'V. a. Bronchialkarzinom (Hämoptysen, Heiserkeit, B-Symptomatik, starke Raucherin, Asbestexposition)',
 name:'Monika Schulz',anrede:'Frau Schulz',sex:'f',age:61,voice:'glassy',
 look:{skin:'#efcfb6',hair:'#8a6a4e',style:'bun',shirt:'#7a4e63',glasses:false,beard:false},
 story:`Monika Schulz, 61 Jahre, geboren am 03.09.1965. 1,65 m, 58 kg (vor 6 Monaten 64 kg).
HAUPTBESCHWERDE: Husten seit ca. 2 Monaten, schleichend. Anfangs trocken, jetzt mit Auswurf: weißlich-gelblich, zäh. Seit 2 Wochen 2–3 Mal morgens Blutfäden im Auswurf (kleine Menge, hellrot). Husten wird schlimmer, besonders morgens. Kein bestimmter Auslöser.
STIMME: Seit ca. 3 Wochen heiser.
ATMUNG: Atemnot bei Belastung, z. B. nach 2 Stockwerken muss sie stehen bleiben. In Ruhe nicht. Nachts manchmal Husten.
SCHMERZ: Dumpfe Schmerzen rechte Brustseite, 4 von 10, beim Husten stärker, keine Ausstrahlung.
INFEKT: Keine bekannte Erkältung vorher, kein COVID-Kontakt.
VEGETATIV: Nachtschweiß fast jede Nacht (muss T-Shirt wechseln). Temperatur manchmal 37,8 °C. 6 kg ungewollt abgenommen in 6 Monaten. Appetit weniger. Müde und schlapp. Keine Übelkeit. Stuhlgang und Wasserlassen normal. Schläft wegen Husten schlecht.
GYN: Keine Periode mehr seit Gebärmutterentfernung 2010.
VORERKRANKUNGEN: COPD seit 5 Jahren. Schilddrüsenunterfunktion.
OPERATIONEN: Gebärmutterentfernung 2010 wegen Myomen.
MEDIKAMENTE: Spiriva-Spray 1x täglich, Salbutamol-Spray bei Bedarf (jetzt öfter, 3–4 Mal am Tag), L-Thyroxin 75 µg morgens.
ALLERGIEN: Hausstaub (Schnupfen). Keine Medikamentenallergie.
IMPFUNGEN: Grippe jedes Jahr, COVID 3x.
NOXEN: Raucht seit 40 Jahren 1 Schachtel (20 Zigaretten) am Tag. Alkohol: ab und zu ein Glas Wein. Keine Drogen.
FAMILIE: Bruder mit 65 an Lungenkrebs gestorben. Vater an Herzinfarkt verstorben. Mutter lebt, Diabetes.
SOZIAL: Verwitwet seit 3 Jahren. Eine Tochter (gesund). Lebt allein in einer Wohnung in Hannover. Hat 25 Jahre in einer Firma für Dämmung und Isolierung gearbeitet (auch mit alten Asbestplatten), jetzt in Frührente.`,
 cues:`1) Wenn es um das Blut im Auswurf geht, sagst du ängstlich: "Mein Bruder hatte auch Blut beim Husten, und dann war es Lungenkrebs. Habe ich Krebs, Herr Doktor?"
2) Beim Thema Rauchen sagst du: "Ich weiß, ich weiß... Aber ich schaffe es einfach nicht aufzuhören."
3) Mitten im Gespräch sagst du einmal, dass du gerade schlecht Luft bekommst (nur leicht).
4) Am Ende fragst du: "Muss ich ins Krankenhaus?"`},

{id:'oesophagus',sec:'krebs',topic:'oesophagus',close:'oesophagus',title:'Ösophaguskarzinom',dx:'V. a. Ösophaguskarzinom (progrediente Dysphagie fest → breiig, Gewichtsverlust, langjähriger Reflux, Nikotin- und Alkoholabusus)',

 story:`Dieter Wagner, 67 Jahre, geboren am 21.01.1959. 1,75 m, 68 kg (vor 4 Monaten 78 kg).
HAUPTBESCHWERDE: Seit ca. 3 Monaten Probleme beim Schlucken. Schrittweise angefangen. Zuerst nur bei fester Nahrung (Fleisch, Brot), jetzt auch bei Brei. Getränke gehen noch. Gefühl, dass das Essen hinter dem Brustbein stecken bleibt. Wird immer schlimmer. Isst fast nur noch Suppe.
SCHMERZ: Beim Schlucken brennende Schmerzen hinter dem Brustbein, 5 von 10, keine Ausstrahlung.
WEITERE: Unverdautes Essen kommt manchmal wieder hoch. Mehr Speichel im Mund. Leicht heiser seit ein paar Wochen. Nachts trockener Husten im Liegen. Sodbrennen und saures Aufstoßen seit über 10 Jahren. Kein Kloßgefühl, Hals nicht geschwollen. Kein Völlegefühl.
VEGETATIV: 10 kg ungewollt abgenommen in 4 Monaten. Appetit eigentlich da, aber Angst vor dem Essen. Müde, schwach. Keine Übelkeit, kein Erbrechen. Stuhlgang normal, kein schwarzer Stuhl. Wasserlassen normal. Kein Fieber, kein Nachtschweiß. Schläft unruhig wegen Husten.
VORERKRANKUNGEN: Refluxkrankheit seit Jahren. Gicht.
OPERATIONEN: Künstliches Kniegelenk links 2019, ohne Komplikationen.
MEDIKAMENTE: Pantoprazol 40 mg (nimmt es nur unregelmäßig, "wenn es brennt"), Allopurinol 300 mg täglich.
ALLERGIEN: Keine bekannt.
IMPFUNGEN: Grippe-Impfung letztes Jahr, sonst weiß er es nicht.
NOXEN: Raucht seit 45 Jahren ca. 15 Zigaretten am Tag. Trinkt täglich 2 Schnäpse und 2 Bier. Keine Drogen.
FAMILIE: Mutter an Magenkrebs gestorben (mit 72). Vater an Schlaganfall gestorben.
SOZIAL: Geschieden, lebt allein in Dortmund. Ein Sohn, gesund, wohnt weit weg. Rentner, war Metzger.`,
 cues:`1) Wenn du von den Schluckbeschwerden erzählst, sagst du verzweifelt: "Ich kann kaum noch was essen, Herr Doktor. Ich hab Angst, dass ich verhungere."
2) Beim Alkohol spielst du es erst herunter ("nur ein bisschen") und gibst erst auf genaue Nachfrage die Menge zu.
3) Am Ende fragst du: "Muss ich jetzt einen Schlauch schlucken? Eine Magenspiegelung?"`},

{id:'migraene',sec:'neuro',topic:'migraene',close:'migraene',title:'Migräne',dx:'Migräne mit Aura (einseitig, pulsierend, Photo-/Phonophobie, Flimmerskotom) – cave: orale Kontrazeption bei Migräne mit Aura',

 story:`Julia Hoffmann, 29 Jahre, geboren am 17.06.1997. 1,70 m, 60 kg.
HAUPTBESCHWERDE: Seit 2 Tagen starke Kopfschmerzen auf der linken Seite, hinter dem linken Auge bis zur Schläfe. Pulsierend, "wie ein Hämmern". 8 von 10. Langsam stärker geworden (nicht schlagartig). Schlimmer bei Bewegung, z. B. Treppensteigen. Im dunklen Zimmer etwas besser.
VORGESCHICHTE: Hat seit 3 Jahren solche Attacken, 2–3 Mal im Monat, dauern sonst 1 Tag. Diesmal stärker und länger.
AURA: Vor den Schmerzen ca. 20 Minuten Flimmern und Zickzack-Linien vor den Augen.
BEGLEITEND: Licht- und Lärmempfindlich. Übelkeit, zweimal erbrochen (Essensreste). Keine Lähmungen, kein Taubheitsgefühl, Sprechen normal. Kein Fieber, Nacken nicht steif. Keine Kopfverletzung. Augen nicht rot, kein Tränen.
AUSLÖSER: Stress, wenig Schlaf, Periode, Rotwein.
MEDIKAMENTE DAGEGEN: Ibuprofen 400 mg, gestern 3 Tabletten, hat nicht geholfen.
VEGETATIV: Appetit wenig wegen Übelkeit. Gewicht stabil. Stuhl, Wasserlassen normal. Schläft schlecht wegen Stress.
GYN: Periode hat vor 3 Tagen angefangen, regelmäßig. Nimmt die Pille (seit 8 Jahren). Keine Schwangerschaft möglich.
VORERKRANKUNGEN: Asthma als Kind, jetzt keine Beschwerden.
OPERATIONEN: Keine. Weisheitszähne gezogen.
MEDIKAMENTE: Pille, sonst nichts.
ALLERGIEN: Pollen (Heuschnupfen). Keine Medikamentenallergie.
IMPFUNGEN: Alles aktuell.
NOXEN: Nichtraucherin. Am Wochenende 1–2 Gläser Wein. Keine Drogen.
FAMILIE: Mutter hat auch Migräne. Vater Bluthochdruck.
SOZIAL: Ledig, hat einen Freund, wohnt mit ihm in Köln. Grundschullehrerin, gerade viel Stress (Zeugnisse).`,
 cues:`1) Gleich am Anfang, wenn es um die Schmerzen geht, sagst du: "Ich habe wirklich starke Schmerzen. Können Sie mir bitte etwas geben?"
2) Später fragst du ängstlich: "Kann das ein Hirntumor sein? Meine Kollegin hat sowas gesagt."
3) Wenn der Arzt nach Medikamenten fragt, erwähnst du die Pille nur, wenn er ausdrücklich nach Verhütung oder allen Medikamenten fragt.`},

{id:'vertigo',sec:'neuro',topic:'vertigo',close:'vertigo',title:'Vertigo / Tinnitus',dx:'V. a. Morbus Menière (rezidivierender Drehschwindel über Stunden, einseitiger Tinnitus, Hörminderung, Ohrdruck rechts)',

 look:{skin:'#dcae8c',hair:'#4a3a2e',style:'short',shirt:'#2f4f6e',glasses:false,beard:false},
 story:`Andreas Krüger, 52 Jahre, geboren am 08.11.1973. 1,82 m, 90 kg.
HAUPTBESCHWERDE: Seit ca. 2 Monaten Schwindelattacken, insgesamt 4 Mal. Letzte Attacke heute Morgen. Alles dreht sich (Drehschwindel). Kommt plötzlich, dauert jeweils 2–3 Stunden. Nicht abhängig von Kopfbewegung oder Lage. Muss sich dann hinlegen.
BEGLEITEND: Bei den Attacken starke Übelkeit, heute 2x erbrochen. Augenzittern hat seine Frau einmal gesehen. Sehen sonst normal.
OHR: Rauschen im rechten Ohr, tief, wie ein Wasserfall, seit ca. 2 Monaten, vor und während der Attacken lauter. Druckgefühl im rechten Ohr. Hört rechts schlechter, auch zwischen den Attacken. Nicht pulsierend. Wird langsam schlimmer.
NEURO: Keine Lähmungen, kein Taubheitsgefühl, Sprechen normal. Keine Kopfschmerzen.
VEGETATIV: Appetit normal, Gewicht stabil, kein Fieber. Stuhl und Wasserlassen normal. Schläft schlecht wegen dem Rauschen. Konzentration schlechter. Angst vor der nächsten Attacke.
VORERKRANKUNGEN: Erhöhte Cholesterinwerte. Bandscheibenvorfall LWS 2018 (ohne OP behandelt).
OPERATIONEN: Mandeln als Kind entfernt.
MEDIKAMENTE: Simvastatin 20 mg abends. Heute Vomex gegen Übelkeit selbst genommen.
ALLERGIEN: Erdnüsse (Schwellung im Mund).
IMPFUNGEN: Aktuell, Tetanus vor 4 Jahren.
NOXEN: Ex-Raucher (10 Jahre geraucht, 10 Zigaretten am Tag, vor 15 Jahren aufgehört). Am Wochenende 2 Bier. Trinkt ca. 5 Tassen Kaffee am Tag. Keine Drogen.
FAMILIE: Vater mit 75 Schlaganfall, lebt noch. Mutter Diabetes.
SOZIAL: Verheiratet, 3 Kinder (gesund). Wohnt in Bremen. Busfahrer im Linienverkehr.`,
 cues:`1) Im Gespräch sagst du einmal: "Mir ist gerade wieder ein bisschen übel."
2) Wenn es um die Arbeit geht, fragst du besorgt: "Darf ich noch Bus fahren? Ich kann nicht einfach aufhören zu arbeiten."
3) Am Ende fragst du: "Werde ich taub auf dem Ohr?"`},

{id:'knie',sec:'unfall',topic:'knie',close:'gelenk',title:'Knieverletzung',dx:'V. a. vordere Kreuzbandruptur rechts (Drehtrauma, Knacken, sofortige Schwellung, Instabilität), DD Meniskusläsion',
 name:'Lukas Meier',anrede:'Herr Meier',sex:'m',age:24,voice:'buttery',
 look:{skin:'#f0cdb2',hair:'#c79a5a',style:'curly',shirt:'#c0453a',glasses:false,beard:false},
 story:`Lukas Meier, 24 Jahre, geboren am 02.04.2002. 1,85 m, 78 kg.
UNFALL: Gestern Abend gegen 20 Uhr beim Fußballspielen im Verein. Beim schnellen Richtungswechsel hat sich das rechte Knie verdreht, Fuß blieb im Rasen stecken. Ist hingefallen, auf die rechte Seite. Kein Kontakt mit Gegenspieler. Hat ein lautes Knacken im Knie gehört. Kein Helm (Fußball). Kopf nicht angeschlagen, nicht schwindelig, nicht ohnmächtig. Ein Freund hat ihn heute mit dem Auto gebracht.
SCHMERZ: Rechtes Knie, eher innen und vorne. Stechend, 7 von 10, beim Gehen stärker. Keine Ausstrahlung.
BEFUND (Patient): Knie sofort dick geworden (innerhalb einer Stunde). Warm, leicht rot. Kann das Knie nicht ganz strecken und nicht ganz beugen. Kann nur kurz und humpelnd auftreten. Gefühl, dass das Knie wegknickt / nachgibt. Keine Fehlstellung gesehen. Kein Kribbeln, kein Taubheitsgefühl im Fuß. Kleine Schürfwunde am rechten Knie.
MASSNAHMEN: Gekühlt, Bein hochgelegt. Ibuprofen 600 mg einmal gestern Abend, hat etwas geholfen.
FRÜHER: 2020 linkes Sprunggelenk verstaucht. Rechtes Knie bisher nie verletzt.
TETANUS: Weiß nicht, letzte Impfung wahrscheinlich als Kind/Jugendlicher.
VEGETATIV: Alles normal, kein Fieber.
VORERKRANKUNGEN: Keine. OPERATIONEN: Keine.
MEDIKAMENTE: Keine regelmäßig.
ALLERGIEN: Pflaster (juckender Ausschlag).
NOXEN: Raucht nur auf Partys ein paar Zigaretten. Am Wochenende Alkohol, 4–5 Bier. Ab und zu Cannabis (gibt er nur zögerlich zu).
FAMILIE: Mutter Rheuma, Vater gesund.
SOZIAL: Ledig, wohnt in einer WG in Stuttgart. Studiert Maschinenbau, jobbt als Kellner.`,
 cues:`1) Wenn der Arzt nach den Schmerzen fragt, sagst du: "Es tut echt weh, vor allem wenn ich auftrete."
2) Später fragst du: "Wann kann ich wieder Fußball spielen? Wir haben in zwei Wochen ein wichtiges Spiel."
3) Am Ende fragst du: "Muss ich operiert werden?"`},

{id:'knieluxation',sec:'unfall',topic:'knie',close:'gelenk',title:'Knieluxation (Patella)',dx:'Rezidivierende laterale Patellaluxation links mit spontaner Reposition',
 name:'Sarah Klein',anrede:'Frau Klein',sex:'f',age:19,voice:'airy',
 look:{skin:'#f3d6c3',hair:'#1f1a17',style:'ponytail',shirt:'#6a5acd',glasses:false,beard:false},
 story:`Sarah Klein, 19 Jahre, geboren am 25.10.2007. 1,68 m, 55 kg.
UNFALL: Heute Vormittag im Tanztraining (Hip-Hop). Bei einer schnellen Drehung auf dem linken Bein ist die Kniescheibe "nach außen gesprungen". Das Knie sah ganz komisch aus, die Kniescheibe stand seitlich. Ist nicht hingefallen, hat sich hingesetzt. Als sie das Bein gestreckt hat, ist die Kniescheibe von selbst wieder zurückgesprungen. Kopf nicht verletzt, kein Schwindel, nicht ohnmächtig. Die Trainerin hat sie mit dem Auto gebracht.
SCHMERZ: Linkes Knie, vorne und innen an der Kniescheibe. Drückend-stechend, 6 von 10. Keine Ausstrahlung.
BEFUND (Patient): Knie geschwollen (direkt danach). Fühlt sich instabil an, hat Angst, es zu belasten. Kann es beugen, aber mit Schmerzen. Kann humpelnd gehen. Kein Knacken gehört, eher ein "Wegrutschen". Kein Kribbeln, keine Taubheit im Fuß. Keine Schürfwunden.
FRÜHER: Vor 2 Jahren schon einmal das Gleiche beim Sport, gleiche Seite. Damals Schiene getragen.
TETANUS: Vor 3 Jahren aufgefrischt.
MEDIKAMENTE DAGEGEN: Noch nichts, nur gekühlt.
VEGETATIV: Unauffällig.
GYN: Letzte Periode vor 2 Wochen, regelmäßig, nimmt die Pille. Schwangerschaft nicht möglich.
VORERKRANKUNGEN: Keine. OPERATIONEN: Keine.
MEDIKAMENTE: Pille.
ALLERGIEN: Nickel (Ausschlag bei Schmuck).
NOXEN: Nichtraucherin, kaum Alkohol, keine Drogen.
FAMILIE: Mutter Schilddrüsenunterfunktion. Vater gesund.
SOZIAL: Ledig, wohnt bei den Eltern in Leipzig. Macht gerade Abitur. Tanzt 4 Mal pro Woche.`,
 cues:`1) Wenn der Arzt von Röntgen oder Untersuchungen spricht, fragst du: "Ist Röntgen nicht gefährlich? Die Strahlung?"
2) Wenn es um Schmerzen geht, sagst du, dass du es noch aushalten kannst, aber gerne etwas hättest.
3) Am Ende fragst du: "Muss ich im Krankenhaus bleiben? Ich habe nächste Woche Abiprüfung."`},

{id:'sprung',sec:'unfall',topic:'sprung',close:'gelenk',title:'Sprunggelenkverletzung',dx:'Supinationstrauma rechts, V. a. Außenbandverletzung, DD Fraktur (Knacken, kaum belastbar) – Tetanus auffrischen, ASS-/NSAR-Unverträglichkeit beachten',
 name:'Andrea Schneider',anrede:'Frau Schneider',sex:'f',age:45,voice:'glassy',
 look:{skin:'#e8bf9f',hair:'#9c4a2a',style:'long',shirt:'#2f6f8f',glasses:true,beard:false},
 story:`Andrea Schneider, 45 Jahre, geboren am 14.02.1981. 1,64 m, 70 kg.
UNFALL: Heute Morgen gegen 7:30 Uhr auf der nassen Treppe vor der Bäckerei umgeknickt, rechter Fuß nach innen umgeknickt (Fuß nach innen, Knöchel nach außen). Ist dann gestürzt, auf das linke Knie gefallen. Kopf nicht angeschlagen, nicht schwindelig, nicht ohnmächtig. Ehemann hat sie mit dem Auto gebracht.
SCHMERZ: Rechts außen am Knöchel. Stechend, 7 von 10, beim Auftreten 9. Keine Ausstrahlung.
BEFUND (Patient): Hat ein Knacken gehört. Knöchel sofort geschwollen, blauer Fleck, warm. Kann den Fuß nur wenig bewegen, kann kaum auftreten. Keine Fehlstellung gesehen. Kein Kribbeln, keine Taubheit. Schürfwunde am linken Knie.
FRÜHER: Ist rechts schon öfter umgeknickt, aber nie so schlimm.
TETANUS: Letzte Impfung vor ca. 12 Jahren.
MEDIKAMENTE DAGEGEN: Noch nichts genommen, weil sie Aspirin/Ibuprofen nicht verträgt.
VEGETATIV: Unauffällig.
GYN: Periode unregelmäßig, letzte vor 2 Wochen. Schwangerschaft unwahrscheinlich (Mann sterilisiert).
VORERKRANKUNGEN: Schilddrüsenunterfunktion. Asthma (leicht).
OPERATIONEN: Kaiserschnitt 2010.
MEDIKAMENTE: L-Thyroxin 50 µg morgens. Asthmaspray bei Bedarf.
ALLERGIEN/UNVERTRÄGLICHKEIT: Nach Aspirin und Ibuprofen bekommt sie Atemnot (Asthmaanfall).
IMPFUNGEN: Siehe Tetanus, sonst Kinderimpfungen.
NOXEN: Raucht 5 Zigaretten am Tag seit 20 Jahren. Alkohol selten. Keine Drogen.
FAMILIE: Mutter Osteoporose, Vater Diabetes.
SOZIAL: Verheiratet, 2 Kinder (14 und 16). Wohnt in Nürnberg. Verkäuferin im Supermarkt, steht den ganzen Tag.`,
 cues:`1) Früh im Gespräch sagst du: "Ich habe starke Schmerzen, Frau Doktor/Herr Doktor. Können Sie mir etwas geben?"
2) Wenn der Arzt dir ein Schmerzmittel anbietet und nicht nach Unverträglichkeiten fragt, erwähnst du es nicht von dir aus.
3) Am Ende fragst du: "Wie lange werde ich krankgeschrieben? Ich muss arbeiten."`},

{id:'mandel',sec:'hals',topic:'mandel',close:'mandel',title:'Mandelentzündung',dx:'V. a. bakterielle Tonsillitis (hohes Fieber, Beläge, schmerzhafte Lymphknoten, kein Husten) – Amoxicillin-Unverträglichkeit beachten',
 name:'Laura Fischer',anrede:'Frau Fischer',sex:'f',age:22,voice:'airy',
 look:{skin:'#f4dccb',hair:'#d8b46a',style:'long',shirt:'#d98c4f',glasses:false,beard:false},
 story:`Laura Fischer, 22 Jahre, geboren am 30.07.2004. 1,72 m, 62 kg.
HAUPTBESCHWERDE: Seit 3 Tagen starke Halsschmerzen, ganz plötzlich angefangen. Beidseits. Brennend-stechend, 7 von 10, beim Schlucken 9. Strahlt in beide Ohren aus. Wird schlimmer.
MANDELN: Hat im Spiegel gesehen: Mandeln stark geschwollen, rot, mit weißen Punkten/Belägen.
WEITERE: Starke Schluckbeschwerden, kann kaum essen, nur trinken. Lymphknoten am Hals dick, schmerzhaft, verschiebbar. Kloßgefühl, Stimme klingt "kloßig". Mundgeruch. Kein Husten, kein Schnupfen.
FIEBER: Gestern Abend 39,2 °C gemessen. Schüttelfrost. Nachts verschwitzt. Sehr müde und schlapp.
VEGETATIV: Appetit kaum, isst wenig wegen Schmerzen. Keine Übelkeit. Stuhl und Wasserlassen normal. Schläft schlecht.
KONTAKT: Mitbewohnerin hatte letzte Woche ähnliche Beschwerden.
FRÜHER: Letztes Jahr dreimal Mandelentzündung, jeweils mit Antibiotika behandelt.
MEDIKAMENTE DAGEGEN: Paracetamol 500 mg, hilft nur kurz.
GYN: Letzte Periode vor 1 Woche, regelmäßig, Pille. Keine Schwangerschaft.
VORERKRANKUNGEN: Keine. OPERATIONEN: Keine.
MEDIKAMENTE: Pille.
ALLERGIEN: Amoxicillin (Hautausschlag am ganzen Körper vor 2 Jahren).
IMPFUNGEN: Vollständig.
NOXEN: Nichtraucherin. Alkohol selten auf Partys. Keine Drogen.
FAMILIE: Vater Diabetes, Mutter gesund.
SOZIAL: Ledig, WG in Münster, studiert Pharmazie.`,
 cues:`1) Wenn es um Behandlung geht, fragst du: "Brauche ich Antibiotika? Ich hatte mal einen Ausschlag davon."
2) Später fragst du: "Muss man mir die Mandeln rausnehmen? Das ist ja schon das vierte Mal."
3) Du sprichst etwas mühsam, weil das Schlucken weh tut, und sagst einmal: "Entschuldigung, das Sprechen tut weh."`},

{id:'covid',sec:'hals',topic:'hals',close:'husten',title:'Halsschmerzen / Fatigue / COVID',dx:'V. a. COVID-19 (Kontakt zu positivem Kollegen, Fieber, Geruchs-/Geschmacksverlust, Fatigue) bei Asthma und Adipositas',
 name:'Stefan Braun',anrede:'Herr Braun',sex:'m',age:38,voice:'buttery',
 look:{skin:'#c99772',hair:'#2a211b',style:'short',shirt:'#4b5563',glasses:true,beard:true},
 story:`Stefan Braun, 38 Jahre, geboren am 05.12.1987. 1,80 m, 98 kg.
HAUPTBESCHWERDE: Seit 4 Tagen Halsschmerzen, eher kratzend, 4 von 10, schrittweise angefangen, keine Ausstrahlung. Dazu trockener Husten.
WEITERE: Fieber bis 38,5 °C (gemessen). Gliederschmerzen, Kopfschmerzen. Extrem müde und abgeschlagen, liegt nur auf dem Sofa. Seit gestern riecht und schmeckt er fast nichts mehr. Leichte Atemnot beim Treppensteigen (sonst nicht). Keine Lymphknotenschwellung bemerkt. Keine Heiserkeit.
VEGETATIV: Schüttelfrost am ersten Tag. Nachts verschwitzt. Appetit weniger. Gewicht stabil. Leichte Übelkeit, kein Erbrechen. Stuhl leicht weich, Wasserlassen normal. Schläft viel, aber nicht erholsam.
KONTAKT: Ein Kollege aus dem Großraumbüro wurde letzte Woche positiv auf Corona getestet. War vor 6 Tagen auf einem Konzert. Hat keinen Schnelltest gemacht.
VORERKRANKUNGEN: Asthma bronchiale seit der Jugend. Übergewicht.
OPERATIONEN: Meniskus-OP rechts 2016.
MEDIKAMENTE: Salbutamol-Spray bei Bedarf (in den letzten Tagen 2–3 Mal am Tag). Paracetamol 1000 mg gegen Fieber.
ALLERGIEN: Katzenhaare. Keine Medikamentenallergie.
IMPFUNGEN: COVID 3x, letzte 2022. Keine Grippeimpfung.
NOXEN: Raucht E-Zigarette seit 3 Jahren (früher normale Zigaretten, 10 am Tag, 10 Jahre). Alkohol selten. Keine Drogen.
FAMILIE: Mutter Bluthochdruck, Vater gesund.
SOZIAL: Verheiratet, Ehefrau ist in der 20. Woche schwanger. Wohnt in Frankfurt. IT-Berater, Großraumbüro.`,
 cues:`1) Wenn es um Kontakte oder Ansteckung geht, fragst du besorgt: "Meine Frau ist schwanger. Kann ich sie anstecken? Ist das gefährlich für das Baby?"
2) Du sagst einmal, dass du dich extrem schlapp fühlst und eigentlich nur schlafen willst.
3) Am Ende fragst du: "Wie lange muss ich zu Hause bleiben?"`},

{id:'fatigue',sec:'hals',topic:'fatigue',close:'standard',title:'Chronische Fatigue',dx:'V. a. Eisenmangelanämie (Hypermenorrhoe, vegetarisch) und/oder Hypothyreose (Kälteintoleranz, Gewichtszunahme, Obstipation, trockene Haut, FA Hashimoto); DD Depression',
 name:'Sabine Wolf',anrede:'Frau Wolf',sex:'f',age:48,voice:'glassy',
 look:{skin:'#efd2bf',hair:'#6b4b34',style:'bun',shirt:'#8a7a5a',glasses:true,beard:false},
 story:`Sabine Wolf, 48 Jahre, geboren am 19.08.1978. 1,66 m, 72 kg (vor 4 Monaten 68 kg).
HAUPTBESCHWERDE: Seit ca. 4 Monaten immer müder und erschöpft, dauerhaft, nicht nur phasenweise. Schläft 9 Stunden, wacht trotzdem müde auf. Schafft die Arbeit kaum.
WEITERE: Konzentrationsprobleme, vergisst Dinge. Kurzatmig bei Belastung (Treppen). Manchmal Herzklopfen. Schwindel beim schnellen Aufstehen. Friert ständig, auch wenn andere es warm finden. Trockene Haut, Haare fallen mehr aus. Brüchige Nägel.
VEGETATIV: Appetit eher weniger, trotzdem 4 kg zugenommen. Verstopfung (nur alle 3 Tage Stuhlgang). Wasserlassen normal. Kein Fieber, kein Nachtschweiß, eher wenig Schwitzen.
GYN: Periode alle 24 Tage, 7 Tage lang, sehr stark (muss nachts aufstehen zum Wechseln). Letzte Periode vor 10 Tagen. Keine Schwangerschaft möglich (Spirale).
PSYCHE: Viel Stress: pflegt ihre demente Mutter. Stimmung "gedrückt", weint manchmal. Keine Suizidgedanken.
ERNÄHRUNG: Vegetarierin seit 5 Jahren.
VORERKRANKUNGEN: Eisenmangel vor 10 Jahren.
OPERATIONEN: Kaiserschnitt 2005.
MEDIKAMENTE: Johanniskraut aus der Apotheke (selbst gekauft, seit 2 Monaten), Vitamin D. Hormonspirale.
ALLERGIEN: Erdbeeren (Juckreiz). Keine Medikamentenallergie.
IMPFUNGEN: Aktuell.
NOXEN: Nichtraucherin. Alkohol selten. Keine Drogen. 4 Tassen Kaffee am Tag, "sonst schaffe ich nichts".
FAMILIE: Mutter: Hashimoto-Schilddrüse und Demenz. Vater an Herzinfarkt gestorben.
SOZIAL: Verheiratet, ein Sohn (21, gesund, studiert). Wohnt in Augsburg. Buchhalterin in Vollzeit.`,
 cues:`1) Wenn es um Medikamente geht, sagst du stolz: "Ich nehme Johanniskraut, das habe ich mir selbst in der Apotheke gekauft."
2) Später fragst du: "Bin ich depressiv? Ich will aber keine Psychopillen nehmen."
3) Wenn es um deine Mutter geht, wirst du kurz emotional.`},

{id:'thorax',sec:'schmerz',topic:'thorax',close:'thorax',title:'Thoraxschmerzen',dx:'V. a. akutes Koronarsyndrom / Herzinfarkt (Ruheangina, Ausstrahlung linker Arm und Kiefer, vegetative Begleitsymptome, viele Risikofaktoren) – Notfall!',
 name:'Wolfgang Richter',anrede:'Herr Richter',sex:'m',age:58,voice:'rounded',
 look:{skin:'#e6bfa3',hair:'#7d7a74',style:'short',shirt:'#2e5e4e',glasses:false,beard:false},
 story:`Wolfgang Richter, 58 Jahre, geboren am 27.03.1968. 1,76 m, 92 kg.
HAUPTBESCHWERDE: Seit heute Morgen ca. 1 Stunde Schmerzen in der Mitte der Brust, hinter dem Brustbein. Angefangen beim Treppensteigen. Drückend, "wie ein Elefant auf der Brust". 7 von 10. Strahlt in den linken Arm und in den Unterkiefer aus. In Ruhe NICHT besser. Nicht abhängig von Atmung oder Bewegung. Keine Verletzung.
VORGESCHICHTE: Seit ca. 2 Wochen kurze Druckgefühle (5 Minuten) beim Treppensteigen, in Ruhe dann weg. Hat sich nichts dabei gedacht.
BEGLEITEND: Engegefühl, Atemnot (auch jetzt). Kalter Schweiß. Übelkeit, kein Erbrechen. Kein Herzrasen, kein Herzstolpern. Leichter Schwindel. Keine geschwollenen Beine. Kein Husten. Kein Sodbrennen. Kein Fieber.
MEDIKAMENTE DAGEGEN: Nichts.
VEGETATIV: Appetit normal, Gewicht stabil. Stuhl, Wasserlassen normal. Schläft eher schlecht (Stress).
VORERKRANKUNGEN: Bluthochdruck, erhöhte Cholesterinwerte, Diabetes Typ 2.
OPERATIONEN: Gallenblase entfernt 2012.
MEDIKAMENTE: Amlodipin 5 mg morgens, Atorvastatin 40 mg abends, Metformin 850 mg morgens und abends.
ALLERGIEN: Keine bekannt.
IMPFUNGEN: Weiß nicht.
NOXEN: Raucht seit 30 Jahren 20 Zigaretten am Tag. Am Wochenende 3–4 Bier. Keine Drogen.
FAMILIE: Vater mit 55 an Herzinfarkt gestorben. Mutter lebt, Bluthochdruck.
SOZIAL: Verheiratet, 2 Kinder (erwachsen). Wohnt in Bochum. Bauleiter, viel Stress, wenig Bewegung.`,
 cues:`1) Früh im Gespräch sagst du: "Ich bekomme schlecht Luft..."
2) Wenn es um Schmerzen geht, sagst du, dass es sehr drückt.
3) Wenn es um die Familie geht, sagst du ängstlich: "Mein Vater ist mit 55 an einem Herzinfarkt gestorben. Habe ich einen Herzinfarkt?"`},

{id:'bauch',sec:'schmerz',topic:'bauch',close:'bauch',title:'Bauchschmerzen',dx:'V. a. akute Cholezystitis (rechter Oberbauch nach fettem Essen, Ausstrahlung rechte Schulter, Fieber, galliges Erbrechen); DD Choledocholithiasis (heller Stuhl, dunkler Urin)',
 name:'Elke Hartmann',anrede:'Frau Hartmann',sex:'f',age:52,voice:'glassy',
 look:{skin:'#efc9ad',hair:'#b98a4e',style:'curly',shirt:'#9b4d6a',glasses:false,beard:false},
 story:`Elke Hartmann, 52 Jahre, geboren am 09.06.1974. 1,63 m, 88 kg.
HAUPTBESCHWERDE: Seit gestern Abend Bauchschmerzen im rechten Oberbauch, unter dem Rippenbogen. Plötzlich angefangen ca. 1 Stunde nach dem Abendessen (Schweinebraten mit Soße). Zuerst krampfartig, jetzt dauerhaft dumpf-stechend. 7 von 10. Strahlt in die rechte Schulter und in den Rücken aus. Wird schlimmer. Beim tiefen Einatmen stärker.
MEDIKAMENTE DAGEGEN: Buscopan, hat wenig geholfen.
BEGLEITEND: Übelkeit, zweimal erbrochen: zuerst Essensreste, dann gelblich-grün und bitter (Galle), kein Blut. Fieber 38,4 °C gemessen, Schüttelfrost. Völlegefühl.
STUHL/URIN: Stuhl heute etwas heller als sonst, kein Durchfall, kein Blut. Urin dunkler als sonst, kein Brennen. Gelbe Augen? Hat sie nicht bemerkt.
FRÜHER: Zweimal in den letzten Monaten ähnliche, aber kürzere Schmerzen nach fettem Essen, ging von selbst weg.
VEGETATIV: Kein Appetit. Gewicht stabil. Schläft schlecht wegen Schmerzen.
GYN: Keine Periode mehr seit 2 Jahren (Wechseljahre).
VORERKRANKUNGEN: Bluthochdruck, Übergewicht.
OPERATIONEN: Zwei Kaiserschnitte (1998 und 2001).
MEDIKAMENTE: Bisoprolol 5 mg morgens.
ALLERGIEN: Pflaster. Keine Medikamentenallergie.
IMPFUNGEN: Aktuell.
NOXEN: Nichtraucherin. Alkohol selten. Keine Drogen.
FAMILIE: Mutter hatte Gallensteine (operiert). Vater Herzinfarkt.
SOZIAL: Verheiratet, 2 Kinder (erwachsen). Wohnt in Mainz. Bürokauffrau.`,
 cues:`1) Im Gespräch sagst du einmal: "Mir ist schon wieder so übel..."
2) Wenn die Rede von Untersuchungen ist, fragst du: "Muss ich operiert werden? Ich habe solche Angst vor einer Narkose."
3) Am Ende fragst du: "Wie lange muss ich im Krankenhaus bleiben?"`},

{id:'ruecken',sec:'schmerz',topic:'ruecken',close:'ruecken',title:'Rückenschmerzen mit Kribbeln',dx:'V. a. lumbaler Bandscheibenvorfall L5/S1 links mit Radikulopathie S1 (Ausstrahlung bis Fußaußenrand), Red Flags negativ',
 name:'Thomas Neumann',anrede:'Herr Neumann',sex:'m',age:45,voice:'buttery',
 look:{skin:'#d9a982',hair:'#3a3a3a',style:'short',shirt:'#8a5a3a',glasses:false,beard:true},
 story:`Thomas Neumann, 45 Jahre, geboren am 11.09.1981. 1,79 m, 86 kg.
HAUPTBESCHWERDE: Seit 5 Tagen Schmerzen im unteren Rücken. Plötzlich angefangen, als er bei der Arbeit eine Waschmaschine gehoben hat. Einschießend, stechend, 8 von 10. Dauerhaft, beim Bewegen einschießend.
AUSSTRAHLUNG: Ins linke Gesäß, hinten am Oberschenkel bis zur Außenseite des Fußes und zum kleinen Zeh.
NEURO: Kribbeln und Taubheitsgefühl am Fußaußenrand links. Bein fühlt sich etwas schwach an, knickt manchmal ein. Kann gehen, aber langsam.
VERSTÄRKT/LINDERT: Schlimmer beim Husten, Niesen und langen Sitzen. Besser im Liegen mit angewinkelten Beinen. Nachts Schmerzen nur beim Umdrehen.
RED FLAGS: Wasserlassen und Stuhlgang normal. Kein Taubheitsgefühl im Genital- oder Gesäßbereich. Kein Fieber, kein Nachtschweiß, kein Gewichtsverlust. Keine Verletzung/kein Sturz.
FRÜHER: Zweimal "Hexenschuss", aber nie ins Bein.
MEDIKAMENTE DAGEGEN: Ibuprofen 600 mg dreimal täglich seit 4 Tagen und Wärmepflaster, hilft wenig. Seitdem Magendrücken.
VEGETATIV: Appetit normal. Schläft schlecht wegen Schmerzen.
VORERKRANKUNGEN: Magenschleimhautentzündung (Gastritis) vor 3 Jahren.
OPERATIONEN: Leistenbruch links 2010.
MEDIKAMENTE: Pantoprazol 20 mg nur bei Bedarf.
ALLERGIEN: Metamizol (Novalgin) – Kreislaufkollaps.
IMPFUNGEN: Tetanus vor 5 Jahren.
NOXEN: Raucht 10 Zigaretten am Tag seit 25 Jahren. 1–2 Bier am Abend. Keine Drogen.
FAMILIE: Vater Bandscheibenprobleme und Diabetes. Mutter gesund.
SOZIAL: Verheiratet, 2 Kinder (8 und 12). Wohnt in Duisburg. Arbeitet bei einer Umzugsfirma (schweres Heben).`,
 cues:`1) Früh sagst du: "Ich muss unbedingt wieder arbeiten, sonst verliere ich Geld. Können Sie mir nicht einfach eine Spritze geben?"
2) Wenn es um weitere Untersuchungen geht, fragst du: "Brauche ich ein MRT? Ist das gefährlich?"
3) Wenn der Arzt nach Schmerzmitteln fragt, erwähnst du das Magendrücken erst auf Nachfrage.`}
];

async function aiChat(messages,{json=false,signal,fast=false,think}={}){
  const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
  const contents=[];
  for(const m of messages.filter(m=>m.role!=='system')){const r=m.role==='assistant'?'model':'user';const l=contents[contents.length-1];
    if(l&&l.role===r)l.parts[0].text+='\n'+m.content;else contents.push({role:r,parts:[{text:m.content}]})}
  if(!contents.length||contents[0].role!=='user')contents.unshift({role:'user',parts:[{text:'(Gespräch beginnt)'}]});
  const gc={temperature:json?0.3:0.8};
  if(fast)gc.maxOutputTokens=300;
  if(json)gc.responseMimeType='application/json';
  const level=think||(fast?'minimal':null);
  const main=[cfg.model.trim(),'gemini-3.6-flash','gemini-3.8-flash','gemini-flash-latest'];
  const tryModels=(fast?[...FAST_MODELS,...main]:[...main,...FAST_MODELS]).filter((m,i,a)=>m&&a.indexOf(m)===i);
  let d,lastErr;
  for(const model of tryModels){
    const body={contents,generationConfig:Object.assign({},gc)};
    if(sys)body.systemInstruction={parts:[{text:sys}]};
    let lv=level;if(lv==='minimal'&&/3\.8/.test(model))lv='low';
    if(lv&&!noThinkCfg)body.generationConfig.thinkingConfig={thinkingLevel:lv};
    let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key.trim()},body:JSON.stringify(body)});
    d=await r.json().catch(()=>({}));
    if(!r.ok&&r.status===400&&body.generationConfig.thinkingConfig&&/think/i.test((d.error&&d.error.message)||'')){
      noThinkCfg=true;delete body.generationConfig.thinkingConfig;
      r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key.trim()},body:JSON.stringify(body)});
      d=await r.json().catch(()=>({}));
    }
    if(r.ok){if(!fast&&main.includes(model)&&model!==cfg.model){cfg.model=model;saveCfg()}lastErr=null;break}
    lastErr=new Error((d.error&&d.error.message)||('HTTP '+r.status));lastErr.status=r.status;
    if(r.status===404||r.status===429||r.status===503)continue;
    break;
  }

  const text=c&&c.content&&c.content.parts?c.content.parts.filter(p=>!p.thought).map(p=>p.text||'').join(''):'';
  if(!text&&c&&c.finishReason&&c.finishReason!=='STOP'){const e=new Error('Antwort blockiert ('+c.finishReason+')');throw e}
  return {text};
}
function errText(e){
  if(!e)return 'Fehler';
  if(e.status===400&&/key/i.test(e.message)||e.status===401||e.status===403)return L('API-Schlüssel ungültig','Invalid API key');
  if(e.status===429)return L('Kostenloses Limit kurz erreicht – 1 Minute warten','Free limit reached for now – wait 1 minute');
  if(e.status===404||/model/i.test(e.message))return L('Modell nicht gefunden – Modellname in den Einstellungen prüfen','Model not found – check the model name on the start page');

}

function browserSpeak(text,done){
  let fin=false;const finish=()=>{if(fin)return;fin=true;clearTimeout(S.safety);talking(false);done()};
  const fake=()=>{talking(true);clearTimeout(S.mt);S.mt=setTimeout(()=>safe(),Math.min(12000,Math.max(1500,text.length*65)))};

  };
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,150)}else{ss.resume();go()}
}

   <div class="caps">${cap(hasKey(),L('Gemini-Schlüssel','Gemini key'))+cap(!!SR,L('Mikrofon','Microphone'))+cap(!!window.speechSynthesis,L('Stimme','Voice'))}</div>

/* ---------- reading phase ---------- */
function startExam(){startRoom(ROOMS[bagPick('famed-bagR',ROOMS.length)])}
function startRoom(r){
  if(!hasKey()){openSettings(()=>startRoom(r));return}

}
function startAnamOnly(c){
  if(!hasKey()){openSettings(()=>startAnamOnly(c));return}
  newStation(c,null,['anam'],{key:'A:'+c.id,label:L('Teil 1 · Test','Part 1 · Test')+' '+c.num});
}
function startAufOnly(a){
  if(!hasKey()){openSettings(()=>startAufOnly(a));return}
  newStation(null,a,['auf'],{key:'B:'+a.id,label:L('Teil 2 · Test','Part 2 · Test')+' '+(AUF.indexOf(a)+1)});
}
function newStation(c,a,order,meta){
  stopAll();closeSettings();
  ST=Object.assign({a:c,b:a,bp:a?aufPatient(a):null,order,i:0,parts:[],date:new Date()},meta);
  startPart();
}
const partCode=k=>ST.label+(ST.order.length>1?' · Test '+(k==='anam'?'A':'B'):'');
function startPart(){
  stopAll();closeSettings();
  const kind=ST.order[ST.i],c=kind==='anam'?ST.a:ST.bp;
  S={view:'read',kind,c,msgs:[],buf:'',partial:'',busy:false,total:kind==='anam'?CALL_SECONDS:AUF_TOTAL-AUF_READ,notes:'',hf:!!SR,phase:'idle'};S.left=S.total;nav();
  S.r=kind==='anam'?READ_SECONDS:AUF_READ;readView();
  clock=setInterval(()=>{S.r--;const el=$('#rc');if(el)el.textContent=fmtDur(Math.max(S.r,0));if(S.r<=0)beginCall()},1000);
}
function aufSheet(a){

  return `<div class="sheet">
   <div class="sh-k">Kurzbeschreibung</div><p>Führen Sie das Aufklärungsgespräch über einen medizinischen Eingriff durch. Sie sprechen mit <b>${esc(a.anrede)}</b>. Sie haben für die gesamte Situation maximal 11 Minuten Zeit.</p>
   <div class="sh-k">Ihre Rolle</div><p>${esc(a.role)}</p>
   <div class="sh-k">Situation</div><p>Aufklärung über einen Eingriff, der am nächsten Tag stattfinden soll.</p>
   <div class="sh-k">Patienteninformationen</div>
   <table class="shi"><tr><td>Name, Alter</td><td>${who}</td></tr><tr><td>Eingriff</td><td><b>${esc(a.t)}</b> (${esc(a.lay)})</td></tr><tr><td>Dauer</td><td>${esc(a.dur)}</td></tr><tr><td>Grund</td><td>${esc(a.grund)}</td></tr><tr><td>Ablauf</td><td>${esc(a.ablauf)}</td></tr><tr><td>Vorerkrankungen</td><td>${esc(a.vorerk)}</td></tr><tr><td>Dauermedikation</td><td>${esc(a.med)}</td></tr></table>
   <div class="sh-k">Aufgabentext – erklären Sie ${esc(a.anrede)}:</div>
   <ol><li>den Ablauf des Eingriffs (siehe oben)</li><li>die allgemeinen Risiken: ${esc(a.gen.join(', '))}</li><li>die speziellen Risiken:${li(a.spec)}</li><li>das Vorgehen vor dem Eingriff:${li(a.vor)}</li><li>das Vorgehen nach dem Eingriff:${li(a.nach)}</li></ol>
   <p style="margin-top:8px"><b>Gehen Sie auf eventuelle Rückfragen ein.</b></p></div>`;
}
function readView(){
  if(S.kind==='auf')return readViewAuf();
  const c=S.c,r=S.r;
  const de=`Sie sind ${role==='f'?'Allgemeinärztin':'Allgemeinarzt'}. <b>${esc(c.anrede)}</b> stellt sich heute per Videoanruf bei Ihnen vor. Führen Sie das Anamnesegespräch: Stellen Sie sich vor, erheben Sie eine vollständige Anamnese, fassen Sie die Beschwerden zusammen, erklären Sie die nächsten Schritte und gehen Sie auf die Fragen des Patienten ein.`;
  main.innerHTML=`<div class="task"><div style="color:var(--mute);font-size:14px">${partCode('anam')} · ${L('Anamnesegespräch','History taking')} · ${L('Aufgabenstellung','Task')}</div>
   <h2 style="font-size:clamp(26px,3.4vw,36px);margin-top:10px">Videosprechstunde in der Hausarztpraxis</h2>

   <p class="lead" style="margin-top:10px">Sie haben 11 Minuten Zeit. Ein Notizblock steht Ihnen zur Verfügung.</p>
   ${lang==='en'?`<p class="en">English: “You are a GP. <b>${esc(c.anrede)}</b> is seeing you today by video call. Take the patient’s history: introduce yourself, take a complete history, summarise the complaints, explain the next steps and answer the patient’s questions. You have 11 minutes and a notepad.”</p>`:''}
   <div class="count" id="rc">0:${String(Math.max(r,0)).padStart(2,'0')}</div><div class="lead">${L('bis der Anruf startet – danach einfach sprechen','until the call starts – then just talk')}</div>
   <div class="acts"><button class="btn" id="now">${L('Jetzt verbinden','Connect now')}</button><button class="btn ghost" id="back">${L('Zurück','Back')}</button></div></div>`;

}
function readViewAuf(){

   <div style="color:var(--mute);font-size:14px">${partCode('auf')} · ${L('Aufklärungsgespräch','Informed consent talk')} · ${L('Aufgabenblatt','Task sheet')}</div>

/* ---------- 1-minute break between A and B ---------- */

}

   <div style="color:var(--mute);font-size:14px">${partCode('anam')} ${L('beendet','finished')} · ${L('Dauer','Duration')} ${fmtDur(p.dur)}</div>

/* ---------- call: hands-free conversation ---------- */
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const MICOFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg>';
function beginCall(){
  clearInterval(clock);const c=S.c;S.view='call';S.start=Date.now();
  if(S.kind==='auf'){S.total=AUF_TOTAL-(AUF_READ-Math.max(S.r||0,0));S.left=S.total}

   <div class="stage">${avatar(c)}

    <div class="self" id="self"></div>
   </div>
   <div class="controls">
    <button class="mic" id="mic"></button><button class="btn ghost" id="again2" title="Play again">🔊</button>
    <div class="say"><textarea id="txt"></textarea><button class="btn ghost" id="send"></button></div>
    <button class="btn danger" id="end"></button>
   </div>
   <div class="hint" id="hint"></div>
  </div>
  <div class="side"><div class="tabs">${isB?'<button class="on" data-p="pa" id="tab-a"></button>':''}<button class="${isB?'':'on'}" data-p="pn" id="tab-n"></button><button data-p="pt" id="tab-t"></button></div>
   ${isB?`<div class="pane on" id="pa">${aufSheet(ST.b)}</div>`:''}
   <div class="pane${isB?'':' on'}" id="pn"><textarea id="notes" aria-label="Notizblock"></textarea></div>
   <div class="pane" id="pt"><div id="log"><p class="lead" style="font-size:14px" id="lognote"></p></div><div id="trbox"></div></div>
  </div></div>`;
  if(!SR)$('#mic').style.display='none';
  callLabels();micUI();
  if(IS_BRAVE){S.hf=false;$('#hint').textContent=BRAVE_MSG();$('#hint').classList.add('warn');micUI()}
  $('#mic').onclick=micClick;
  $('#again2').onclick=()=>{const last=[...S.msgs].reverse().find(m=>m.who==='pat');if(!last||S.busy)return;stopListening();S.phase='speaking';micUI();speak(last.text,()=>{S.phase='idle';listen()})};
  $('#send').onclick=()=>{const t=$('#txt').value.trim();if(t){$('#txt').value='';S.buf='';S.partial='';doctorSays(t,true)}};
  $('#txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click()}});
  $('#end').onclick=()=>endCall(false);
  $('#notes').addEventListener('input',e=>S.notes=e.target.value);
  document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p))});
  clock=setInterval(tick,1000);tick();
  const first=isB?(ST.b.proxy?'Guten Tag. Ich bin die Mutter von Sandra.':'Guten Tag.'):'Hallo? Ja, ich kann Sie hören. Guten Tag.';
  setTimeout(()=>{if(S&&S.view==='call'&&!S.msgs.length)patientLine(first,()=>listen())},1000);
}
function callLabels(){
  if(!$('#end'))return;
  $('#lbl-call').textContent=S.kind==='auf'?partCode('auf')+' · '+L('Aufklärungsgespräch','Consent talk'):(ST.order.length>1?partCode('anam')+' · ':'')+L('Videosprechstunde','Video consultation');

  $('#self').textContent=L('Sie','You');
  $('#txt').placeholder=SR?L('Optional: hier tippen statt sprechen (Enter = senden)','Optional: type here instead of speaking (Enter = send)'):L('Frage hier eintippen (Enter = senden)','Type your question here (Enter = send)');
  $('#send').textContent=L('Senden','Send');$('#end').textContent=L('Beenden','End');
