 ['Bisherige Medikation','Keine regelmäßige Medikation.'],
 ['Behandlungsplan','Aufnahme zur Versorgung der Wunde und 24-stündigen neurologischen Überwachung.\nWunde: Reinigung, Desinfektion, ggf. Naht, steriler Verband, regelmäßiger Verbandswechsel.\nÜberwachung: neurologische Kontrollen alle 2–4 Stunden, auf Spätkomplikationen achten (posttraumatische Kopfschmerzen, Schwindel, Übelkeit).\nBeratung: Eltern über Warnzeichen aufklären (Bewusstseinsveränderung, Übelkeit, Erbrechen, Sehstörungen). Kontrolle beim Haus- oder Kinderarzt innerhalb einer Woche.']],
 kern:['Sturz vom Skateboard mit Kopfplatzwunde occipital ca. 3 cm, Schwindel, Kopfschmerzen','Keine Bewusstlosigkeit, kein Erbrechen; wirkt ruhiger (Fremdanamnese der Eltern)','GCS 15, neurologisch unauffällig','CCT und CT-Wirbelsäule ohne Blutung/Fraktur','Verdachtsdiagnose Kopfplatzwunde bei leichtem Schädel-Hirn-Trauma (Commotio möglich)','Procedere: Wundversorgung, 24 h neurologische Überwachung alle 2–4 h, Aufklärung der Eltern über Warnzeichen, Nachkontrolle'],
 qs:['Warum überwachen Sie die Patientin 24 Stunden, obwohl das CT unauffällig ist?','Welche Warnzeichen erklären Sie den Eltern?','Ist der Tetanusschutz geklärt?']},
{id:'hyperkrise',dx:'Hypertensive Krise (mit Zielorganschädigung)',name:'Herr Markus Schneider',age:47,sex:'m',s:[
 ['Vorstellungsgrund','Notfallmäßige Aufnahme wegen starker Kopfschmerzen, Schwindel, Übelkeit und Sehstörungen seit heute Morgen. Außerdem retrosternales Druckgefühl und Luftnot bei geringer Belastung.'],
 ['Vorgeschichte','Arterielle Hypertonie seit 5 Jahren (unregelmäßige Medikamenteneinnahme), DM Typ 2, Hyperlipidämie, Nikotinabusus (20 pack years).'],
 ['Körperliche Untersuchung','RR 210/120 mmHg, Puls 110/min, Temperatur 36,8 °C, SpO₂ 94 % (Raumluft), adipöser EZ (BMI 30,4), altersentsprechender AZ. Gesicht stark gerötet. Herz: Tachykardie. Lunge: basal feinblasige Rasselgeräusche beidseits. Extremitäten: Varizen an beiden Unterschenkeln.\nUnauffällig: Neurostatus (jedoch Schwindel und Sehstörungen), Abdomen, Reflexe.'],
 ['Labor (Hausarzt)','Entzündungsparameter normal, Blutzucker 220 mg/dl, Kreatinin 1,8 mg/dl ↑, Harnstoff 48 mg/dl ↑, Troponin T 0,05 ng/ml (leicht ↑), Kalium 5,2 mmol/l (leicht ↑), Natrium 138 mmol/l.\nUrin: Mikroalbuminurie (++), keine Hämaturie.'],
 ['Bildgebung','Röntgen-Thorax: pulmonale Stauung, Kardiomegalie.\nEKG und Echokardiographie: kein Anhalt für Myokardinfarkt, linksventrikuläre Hypertrophie, EF 45 % (leicht reduziert).\nFunduskopie: Papillenödem, arteriovenöse Kreuzungszeichen (hypertensive Retinopathie).'],
 ['Bisherige Medikation','Ramipril 5 mg 1-0-0, Metformin 1000 mg 1-0-1, Atorvastatin 20 mg 0-1-0 – alle unregelmäßig eingenommen.'],
 ['Behandlungsplan','Intensivstation mit kontinuierlicher Blutdrucküberwachung. Nitroprussid-Natrium i.v. zur kontrollierten Blutdrucksenkung, Furosemid i.v. bei Lungenstauung. CT-Kopf zum Ausschluss einer hypertensiven Enzephalopathie.\nLangfristig: antihypertensive Kombinationstherapie, Anpassung der antidiabetischen Therapie, Schulung zur Therapieadhärenz und Lebensstil (Nikotinkarenz, Gewichtsreduktion, salzarme Ernährung).']],
 kern:['Kopfschmerz, Schwindel, Übelkeit, Sehstörungen, retrosternaler Druck, Belastungsdyspnoe','Hypertonie mit schlechter Adhärenz, DM 2, Hyperlipidämie, 20 py','RR 210/120 mmHg, Tachykardie 110, basale Rasselgeräusche','Zielorganschäden: Kreatinin 1,8, Mikroalbuminurie, Troponin leicht ↑, Lungenstauung, EF 45 %, Papillenödem','Verdachtsdiagnose hypertensiver Notfall mit kardialer, renaler und retinaler Organschädigung','Therapie: ITS, kontrollierte RR-Senkung mit Nitroprussid, Furosemid, CCT; langfristig Kombitherapie und Schulung'],
 qs:['Wie schnell senken Sie den Blutdruck – und warum nicht schneller?','Was ist der Unterschied zwischen hypertensiver Dringlichkeit und Notfall?','Warum machen Sie ein CT vom Kopf?','Wie interpretieren Sie das leicht erhöhte Troponin?']},
{id:'crohn',dx:'Morbus Crohn (akuter Schub)',name:'Frau Julia Meier',age:21,sex:'f',s:[
 ['Vorstellungsgrund','Seit 2 Wochen zunehmende Schmerzen im rechten Unterbauch und Durchfall. Außerdem Gelenkschmerzen, Müdigkeit, Leistungsschwäche und Gewichtsverlust von 3 kg.'],
 ['Vorgeschichte','Bekannter Morbus Crohn (terminales Ileum) seit 2 Jahren, mit Azathioprin behandelt. Appendektomie mit 14 Jahren. Raucherin, gelegentlich Alkohol. Keine Allergien.'],
 ['Körperliche Untersuchung','RR 105/65 mmHg, Puls 101/min, Temperatur 37,6 °C, SpO₂ 98 %, reduzierter AZ, untergewichtiger EZ (171 cm, 47 kg). Haut blass und trocken, Mundschleimhaut trocken. Abdomen weich, Druckschmerz im rechten Unterbauch, Darmgeräusche vorhanden, reizlose Narben nach laparoskopischer Appendektomie. Rektal: perianale Fistel, Tastuntersuchung schmerzbedingt nicht möglich. Extremitäten: Schwellung, Rötung und Überwärmung aller Finger- und Zehengelenke sowie der Sprung- und Kniegelenke beidseits.\nUnauffällig: Herz, Lunge, Neurostatus.'],
 ['Labor (Hausarzt)','Hb 9,8 g/dl, Hkt 30 %, Leukozyten 13.500/µl, CRP 28 mg/dl. Ferritin ↑, Eisen ↓, Transferrin ↓ (chronische Entzündung). Vitamin B12, D, K ↓, Quick ↓, INR ↑, Albumin ↓ (Malabsorption).\nUnauffällig: Blutzucker, Nierenfunktion, Elektrolyte, Urinstatus.'],
 ['Bildgebung','Ileokoloskopie mit Stufenbiopsien: diskontinuierlicher Befall.\nAbdomensonographie: entzündete Dünn- und Dickdarmabschnitte, keine Stenosen oder Abszesse.\nMR-Enterographie: entzündliche Veränderungen im terminalen Ileum, keine Abszesse oder Fisteln.'],
 ['Bisherige Medikation','Azathioprin 100 mg 1-0-0 (regelmäßig eingenommen)'],
 ['Einweisung','Einweisung mit der Bitte um stationäre Aufnahme und spezialisierte Behandlung.']],
 kern:['Rechtsseitige Unterbauchschmerzen, Diarrhö, Arthralgien, Fatigue, Gewichtsverlust 3 kg','Bekannter M. Crohn (terminales Ileum) unter Azathioprin; Raucherin','Tachykardie 101, subfebril, BMI ≈ 16, Exsikkose, perianale Fistel, Polyarthritis','Anämie Hb 9,8, CRP 28, Leukozytose, Malabsorption (Vitamine, Albumin, INR ↑)','Endoskopie/MRT: diskontinuierlicher Befall, keine Abszesse/Stenosen','Verdachtsdiagnose akuter Schub mit extraintestinaler Manifestation; Procedere vorgeschlagen (i.v. Steroide, Volumen, Ernährungstherapie, Vitamin-Substitution, Biologika erwägen, Rauchstopp)'],
 qs:['Welche extraintestinalen Manifestationen sehen Sie bei der Patientin?','Wie behandeln Sie den akuten Schub?','Welches Schmerzmittel würden Sie vermeiden?','Warum ist das INR erhöht?']},
{id:'klavi',dx:'Schlüsselbeinfraktur',name:'Herr Thomas Wagner',age:45,sex:'m',s:[
 ['Vorstellungsgrund','Sturz auf den rechten Schulterbereich beim Eishockey. Danach starke Schmerzen im Bereich des rechten Schlüsselbeins, Arm kann nicht bewegt oder belastet werden.'],
 ['Vorgeschichte','Keine bekannten Vorerkrankungen, Nichtraucher, trinkt gelegentlich Alkohol, regelmäßig sportlich aktiv (Laufen, Eishockey), keine Allergien.'],
 ['Körperliche Untersuchung','Rechtes Schlüsselbein: deutlicher Druckschmerz, Schwellung und Fehlstellung.\nNeurovaskulär: keine Nervenschäden oder Durchblutungsstörungen am rechten Arm (Sensibilität, Motorik und periphere Pulse normal).\nUnauffällig: Vitalzeichen, Herz, Lunge, Bauch, Neurostatus, kein Anhalt für Schädeltrauma.'],
 ['Bildgebung','Röntgen Schulter: dislozierte Fraktur der mittleren Klavikula.\nRöntgen-Thorax: unauffällig, kein Pneumothorax.'],
 ['Labor','Unauffällig.'],
 ['Bisherige Medikation','Keine regelmäßige Medikation, gelegentlich Ibuprofen 400 mg bei Bedarf.'],
 ['Einweisung','Einweisung mit der Bitte um chirurgische Stabilisierung und weitere Versorgung.']],
 kern:['Sturz auf die rechte Schulter beim Eishockey, Schmerzen, Arm nicht belastbar','Keine Vorerkrankungen, keine Allergien','Druckschmerz, Schwellung, Fehlstellung; DMS intakt (Durchblutung, Motorik, Sensibilität)','Röntgen: dislozierte Klavikulaschaftfraktur rechts (mittleres Drittel), kein Pneumothorax','Verdachtsdiagnose dislozierte Klavikulafraktur rechts','Procedere vorgeschlagen: Analgesie, Ruhigstellung, operative Versorgung (Plattenosteosynthese), Aufklärung, Physiotherapie'],
 qs:['Warum haben Sie ein Röntgen-Thorax gemacht?','Konservativ oder operativ – wie entscheiden Sie?','Worauf achten Sie nach der Operation?']},
{id:'ra',dx:'Polyarthritis rheumatica (rheumatoide Arthritis)',name:'Frau Karin Hoffmann',age:68,sex:'f',s:[
 ['Vorstellungsgrund','Seit 4 Tagen zunehmende Gelenkschmerzen, v. a. in Händen, Knien und Schultern. Morgensteifigkeit länger als eine Stunde. Begleitend Schwellung, Rötung und Steifigkeit der Gelenke, Müdigkeit, leichtes Fieber, allgemeines Unwohlsein. Augen: Trockenheit und Rötung beidseits.'],
 ['Vorgeschichte','Arterielle Hypertonie seit 10 Jahren, Hyperlipidämie. Keine bekannten Allergien. Nichtraucherin, trinkt selten Alkohol. Familiäre Disposition für rheumatische Erkrankungen (Mutter).'],
 ['Körperliche Untersuchung','RR 140/90 mmHg, Puls 80/min, AF 16/min, Temperatur 37,5 °C. Gelenke: schmerzhafte, geschwollene Gelenke an beiden Händen und Knien, Bewegungseinschränkung in den Schultern. Augen: beidseitige Bindehautrötung, verminderte Tränenproduktion. Haut: unauffällig, kein Ausschlag.'],
 ['Labor (Hausarzt)','CRP 25 mg/l, BSG 55 mm/h, Rheumafaktor positiv, Anti-CCP-Antikörper positiv, Leukozyten 9.000/µl (leicht ↑).'],
 ['Bildgebung','Röntgen Hände und Knie: keine Erosionen oder Deformitäten, mäßige Weichteilschwellung.\nSonographie Hände: Synovitis der MCP- und PIP-Gelenke beidseits, geringer Erguss.\nRöntgen Schultern: keine knöchernen Destruktionen, Hinweis auf subakromiale Bursitis.'],
 ['Bisherige Medikation','Amlodipin 5 mg 1-0-0\nAtorvastatin 20 mg 1-0-0'],
 ['Diagnostisches und therapeutisches Vorgehen','Prednisolon 15 mg täglich (kurzfristig). Start einer DMARD-Therapie: Methotrexat 15 mg/Woche + Folsäure 5 mg/Woche. Ibuprofen 400 mg bei Bedarf.\nKontrolle von CRP, BSG und Organwerten, Absprache mit der Rheumatologie, augenärztliches Konsil, Physiotherapie.']],
 kern:['Symmetrische Polyarthralgien (Hände, Knie, Schultern), Morgensteifigkeit > 1 h, subfebril','Sicca-Symptomatik der Augen; familiäre Belastung','Synovitis MCP/PIP beidseits, Bewegungseinschränkung Schultern','CRP 25, BSG 55, RF und Anti-CCP positiv, keine Erosionen im Röntgen','Verdachtsdiagnose rheumatoide Arthritis mit sekundärem Sicca-Syndrom','Therapie: Prednisolon 15 mg, MTX 15 mg/Woche + Folsäure, NSAR b. B., Rheumatologie, Augenkonsil, Physiotherapie'],
 qs:['Wie spezifisch sind die Anti-CCP-Antikörper?','Warum geben Sie zusätzlich Folsäure?','Welche Kontrollen brauchen Sie unter Methotrexat?']},
{id:'gastritis',dx:'Gastritis',name:'Herr Jens Meier',age:35,sex:'m',s:[
 ['Vorstellungsgrund','Seit 5 Tagen zunehmende Oberbauchschmerzen, Sodbrennen und Übelkeit. Gelegentliches Erbrechen, meist morgens.'],
 ['Vorgeschichte','Häufiger Alkoholkonsum (ca. 4–5 Bier/Woche), Stress im Beruf, lebt mit Partnerin zusammen, Raucher (15 Zigaretten täglich), Heuschnupfen. Keine Allergie gegen Medikamente.'],
 ['Körperliche Untersuchung','RR 125/80 mmHg, Puls 88/min, Temperatur 37,4 °C, Gewicht 82 kg, normaler AZ. Abdomen: Druckschmerz im Oberbauch, besonders epigastrisch, keine tastbaren Resistenzen, Bruchpforten unauffällig.\nUnauffällig: rektale Untersuchung, Herz, Lunge, Milz, Lymphknoten, Neurostatus.'],
 ['Labor (Hausarzt)','Hämoglobin normal, CRP 10 mg/l, Blutbild unauffällig.'],
 ['Bildgebung','Sonographie: unauffällig.\nÖGD mit Biopsie: erosive Gastritis im Antrum, leichte Schleimhautrötung ohne tiefere Ulzerationen (Histologie in Bearbeitung).\nEKG: unauffällig.'],
 ['Bisherige Medikation','Keine regelmäßige Medikation. Gelegentlich Ibuprofen 600 mg bei Kopfschmerzen, Cetirizin 10 mg 0-0-1 bei Bedarf.'],
 ['Einweisung','Einweisung zur weiteren Diagnostik und medikamentösen Behandlung (Protonenpumpenhemmer, H2-Blocker).']],
 kern:['Epigastrische Schmerzen, Sodbrennen, Übelkeit, morgendliches Erbrechen seit 5 Tagen','Risikofaktoren: Alkohol, Nikotin 15 Zig./Tag, Stress, NSAR (Ibuprofen)','Epigastrischer Druckschmerz, sonst unauffällig; Hb normal','ÖGD: erosive Antrumgastritis ohne Ulkus, Biopsie (H. pylori?) ausstehend; EKG unauffällig','Verdachtsdiagnose erosive Gastritis (DD Ulcus ventriculi/duodeni, Refluxkrankheit, Pankreatitis)','Therapie: PPI, NSAR absetzen, Alkohol- und Nikotinkarenz, ggf. Eradikation bei H. pylori'],
 qs:['Warum haben Sie ein EKG geschrieben?','Was machen Sie, wenn die Biopsie Helicobacter pylori zeigt?','Darf der Patient weiter Ibuprofen nehmen?']},
{id:'osh',dx:'Oberschenkelhalsfraktur',name:'Frau Maria Fischer',age:78,sex:'f',s:[
 ['Vorstellungsgrund','Sturz auf die rechte Seite im Badezimmer, danach starke Schmerzen in der rechten Hüfte, kann nicht aufstehen und das Bein nicht belasten.'],
 ['Vorgeschichte','Osteoporose (seit 8 Jahren bekannt), Bluthochdruck, Schilddrüsenunterfunktion. Keine Allergien, unsportlich, trinkt selten Alkohol, Nichtraucherin.'],
 ['Körperliche Untersuchung','RR 135/85 mmHg, Puls 95/min, Temperatur 37,2 °C, Gewicht 65 kg, erhaltener AZ. Rechtes Bein verkürzt und außenrotiert, Schwellung und Druckschmerz in der rechten Leiste.\nUnauffällig: Herz, Lunge, Bauch, Neurostatus, kein Anhalt für Schädeltrauma.'],
 ['Bildgebung','Röntgen: dislozierte Fraktur des rechten Oberschenkelhalses.'],
 ['Labor','Hämoglobin und CRP annähernd normal, Kreatinin normal, Gerinnung normal, Blutgruppe A Rh+. Unauffällig: Elektrolyte, Blutzucker, Urinstix.'],
 ['Bisherige Medikation','Ramipril 5 mg 1-0-0 (Hypertonie)\nL-Thyroxin 50 µg 1-0-0 (Hypothyreose)\nCalcium/Vitamin D 1-0-0 (Osteoporose)'],
 ['Einweisung','Einweisung mit der Bitte um operative Stabilisierung und weitere Versorgung.']],
 kern:['Häuslicher Sturz auf die rechte Seite, Hüftschmerz, Bein nicht belastbar','Osteoporose, Hypertonie, Hypothyreose','Bein verkürzt und außenrotiert, Leistendruckschmerz','Röntgen: dislozierte Schenkelhalsfraktur rechts; Labor inkl. Gerinnung unauffällig','Verdachtsdiagnose dislozierte mediale Schenkelhalsfraktur rechts; Sturzursache abklären','Procedere vorgeschlagen: Analgesie, zeitnahe OP (z. B. Hüft-TEP/Hemiprothese) innerhalb 24 h, Thromboseprophylaxe, Frühmobilisation, Osteoporosetherapie'],
 qs:['Welche Operation schlagen Sie vor und warum?','Warum soll möglichst schnell operiert werden?','Wie klären Sie die Sturzursache ab?']},
{id:'rippe',dx:'Rippenfraktur (mit Verdacht auf Pneumothorax)',name:'Herr Markus Schmitt',age:23,sex:'m',s:[
 ['Vorstellungsgrund','Schmerzen im Bereich der 4. und 5. Rippe rechts sowie Atemnot nach Sturz beim Mountainbiking direkt auf die rechte Brustseite; seitdem Schwierigkeiten beim tiefen Einatmen.'],
 ['Vorgeschichte','Gesund, keine bekannten Allergien, Nichtraucher, trinkt gelegentlich Alkohol, sportlich aktiv.'],
 ['Körperliche Untersuchung','RR 125/80 mmHg, Puls 95/min, AF 21/min, SpO₂ 95 % (Raumluft), Temperatur 36,9 °C. Ansprechbar, schmerzgeplagt, leicht tachypnoisch, aber stabil. Thorax: Druck- und Klopfschmerz über der 4. und 5. Rippe rechts, leichte Schwellung, kein Hämatom. Abgeschwächtes Atemgeräusch rechts basal, hypersonorer Klopfschall rechts.\nUnauffällig: Abdomen, Herz, Neurostatus.'],
 ['Labor','Blutbild und CRP normal, Blutgruppe B Rh+. Unauffällig: Elektrolyte, Blutzucker, Urinstix.'],
 ['Bildgebung','Röntgen-Thorax: Fraktur der 4. und 5. Rippe rechts ohne Dislokation, kleiner Pneumothorax rechts, kein Hämatothorax.\nFAST-Sonographie: keine freie Flüssigkeit in Thorax oder Abdomen.'],
 ['Bisherige Medikation','Keine regelmäßige Medikation.'],
 ['Behandlungsplan','Stationäre Aufnahme. Überwachung von SpO₂, AF und Zeichen eines zunehmenden Pneumothorax; Röntgen/CT-Kontrolle bei Verschlechterung. Schmerztherapie mit Metamizol/Paracetamol. Thoraxdrainage bei Zunahme des Pneumothorax. Schonung für 4–6 Wochen.']],
 kern:['Thoraxtrauma rechts beim Mountainbiken, atemabhängige Schmerzen, Dyspnoe','AF 21, SpO₂ 95 %, abgeschwächtes Atemgeräusch und hypersonorer Klopfschall rechts','Röntgen: Rippenfraktur 4./5. rechts ohne Dislokation + kleiner Pneumothorax, kein Hämatothorax','FAST ohne freie Flüssigkeit','Verdachtsdiagnose Fraktur der 4. und 5. Rippe rechts mit kleinem Pneumothorax (keine Rippenserienfraktur)','Procedere: Monitoring, Analgesie, Röntgenkontrolle, Thoraxdrainage bei Zunahme, Schonung 4–6 Wochen'],
 qs:['Wann würden Sie eine Thoraxdrainage legen?','Warum ist eine gute Schmerztherapie hier so wichtig?','Woran erkennen Sie einen Spannungspneumothorax?']},
{id:'pyelo',dx:'Pyelonephritis',name:'Frau Lisa Müller',age:32,sex:'f',s:[
 ['Vorstellungsgrund','Seit 3 Tagen Fieber, Schüttelfrost, Flankenschmerzen rechts mit Ausstrahlung in den Unterbauch, Schmerzen beim Wasserlassen, blutiger und trüber Urin. Zusätzlich Schwächegefühl und Übelkeit.'],
 ['Vorgeschichte','Wiederholte Harnwegsinfektionen, regelmäßig menstruierend, keine bekannten Allergien, Nichtraucherin, trinkt selten Alkohol, sportlich aktiv.'],
 ['Körperliche Untersuchung','RR 120/80 mmHg, Puls 105/min, Temperatur 38,9 °C, Gewicht 68 kg. AZ reduziert, erschöpft, fiebrig. Klopfschmerz über dem rechten Nierenlager mit Ausstrahlung in den Unterbauch. Abdomen weich, keine Abwehrspannung, kein Druckschmerz.\nUnauffällig: Herz, Lunge, Neurostatus.'],
 ['Labor (Hausarzt)','Leukozyten ↑, CRP ↑, Kreatinin normal, Hämoglobin normal.\nUrin: Leukozyten +++, Nitrit ++, Blut +++; Urinkultur: Escherichia coli > 10⁶ KBE/ml.'],
 ['Bildgebung','Sonographie: vergrößerte rechte Niere mit angedeuteter Erweiterung des Nierenbeckens, kein Abszess, keine Steine.'],
 ['Bisherige Medikation','Keine regelmäßige Medikation.'],
 ['Einweisung','Einweisung mit der Bitte um stationäre Aufnahme, Antibiotikatherapie und Flüssigkeitssubstitution.']],
 kern:['Fieber, Schüttelfrost, Flankenschmerz rechts, Dysurie, Makrohämaturie seit 3 Tagen','Rezidivierende Harnwegsinfekte','Fieber 38,9 °C, Tachykardie 105, Nierenlagerklopfschmerz rechts','Leukozyturie, Nitrit +, Hämaturie, E. coli > 10⁶ KBE/ml, Kreatinin normal','Sono: vergrößerte rechte Niere, leichte NBKS-Erweiterung, kein Abszess/Stein','Verdachtsdiagnose akute Pyelonephritis rechts; Procedere: i.v. Antibiose (z. B. Ceftriaxon) nach Antibiogramm, Volumen, Analgesie/Antipyrese, Schwangerschaftstest, Kontrolle'],
 qs:['Haben Sie eine Schwangerschaft ausgeschlossen?','Welches Antibiotikum geben Sie und wie lange?','Warum ist die Erweiterung des Nierenbeckens wichtig?']},
{id:'mhk',dx:'Mittelhandfraktur (geschlossene Fraktur des dritten Mittelhandknochens)',name:'Herr Tobias Wagner',age:27,sex:'m',s:[
 ['Vorstellungsgrund','Schmerzen und Schwellung der rechten Hand nach Sturz beim Fußball direkt auf die ausgestreckte Hand. Seitdem Schmerzen und Bewegungseinschränkung, besonders beim Greifen.'],
 ['Vorgeschichte','Gesund, keine bekannten Allergien, Nichtraucher, gelegentlich Alkohol, sportlich aktiv (Fußball, Krafttraining).'],
 ['Körperliche Untersuchung','RR 120/75 mmHg, Puls 88/min, AF 16/min, SpO₂ 98 %, Temperatur 36,8 °C. Wach, ansprechbar, schmerzgeplagt, kreislaufstabil. Hand: Schwellung und Druckschmerz über dem dritten Mittelhandknochen, leichte Fehlstellung, eingeschränkte aktive Beweglichkeit v. a. von Mittel- und Zeigefinger. Keine neurologischen Ausfälle oder Durchblutungsstörungen.'],
 ['Labor (Hausarzt)','Blutbild und CRP normal, Blutgruppe 0 Rh+. Elektrolyte, Blutzucker, Urinstix unauffällig.'],
 ['Bildgebung','Röntgen Hand rechts: Fraktur des dritten Mittelhandknochens, keine offensichtliche Dislokation, keine Gelenkbeteiligung.\nSonographie Hand: keine Hämatome oder Weichteilverletzungen (Sehnen unauffällig).'],
 ['Behandlungsstrategie','Konservativ (stabile, nicht dislozierte Fraktur): Unterarmgipsschiene für 4–6 Wochen, Hochlagerung. Ibuprofen 400 mg alle 6–8 Stunden bei Bedarf, alternativ Paracetamol oder Metamizol. Frühe Mobilisation der nicht betroffenen Finger, Physiotherapie nach Schienenabnahme.\nOperativ bei Dislokation > 2 mm, Rotationsfehlstellung, Gelenkbeteiligung oder Instabilität: K-Draht- oder Plattenosteosynthese, danach ca. 4 Wochen Ruhigstellung und Physiotherapie.']],
 kern:['Sturz auf die ausgestreckte rechte Hand beim Fußball, Schmerzen, Schwellung, Greifschwäche','Gesund, keine Allergien','Druckschmerz MHK III, leichte Fehlstellung, eingeschränkte Fingerbeweglichkeit, DMS intakt','Röntgen: nicht dislozierte Fraktur MHK III ohne Gelenkbeteiligung; Sono ohne Sehnenverletzung','Verdachtsdiagnose geschlossene, nicht dislozierte Fraktur des Os metacarpale III rechts','Konservative Therapie (Unterarmgipsschiene 4–6 Wochen, Hochlagerung, Analgesie, Physiotherapie) und OP-Kriterien genannt'],
 qs:['Wann würden Sie doch operieren?','Wie prüfen Sie eine Rotationsfehlstellung?','Wie lange ist der Patient arbeits- bzw. sportunfähig?']},
{id:'hernie',dx:'Leistenhernie (Hernia inguinalis) links',name:'Herr Thomas Müller',age:42,sex:'m',s:[
 ['Vorstellungsgrund','Seit 3 Monaten schmerzlose Schwellung der linken Leiste, aufgetreten nach einer heftigen Hustenattacke. Seit gestern Abend zunehmende Leistenschmerzen und Übelkeit. Die Vorwölbung lässt sich nicht mehr zurückdrücken.'],
 ['Vorgeschichte','Starker Raucher (30 Zigaretten/Tag seit 25 Jahren), chronischer Raucherhusten. Arthroskopische Meniskusoperation am linken Knie vor 2 Jahren.'],
 ['Körperliche Untersuchung','RR 130/85 mmHg, Puls 76/min, Temperatur 37,1 °C, SpO₂ 96 %. Sichtbare, nicht reponierbare Schwellung in der linken Leiste mit Druckschmerz. Rechte Leiste unauffällig. Hoden beidseits regelrecht tastbar, keine Schwellung oder Druckschmerz.\nUnauffällig: Herz, Reflexe, Neurostatus.'],
 ['Labor (Hausarzt)','Entzündungsparameter und Blutbild normal, Kreatinin 1,0 mg/dl, Harnstoff 35 mg/dl. Unauffällig: Blutzucker, Urinstatus.'],
 ['Bildgebung','Abdomensonographie: Hernie links inguinal mit Darmschlingen im Bruchsack, kein Hinweis auf Darmischämie.\nRöntgen Abdomen: keine freie Luft, kein Ileus.'],
 ['Bisherige Medikation','Keine regelmäßige Medikation, gelegentlich Ibuprofen 400 mg bei Gelenkschmerzen.'],
 ['Behandlungsplan','Patient derzeit stabil. Metamizol i.v. 3x täglich.\nNotfallmäßige OP: laparoskopische Hernienreparation (TAPP). Aufklärung und Einwilligung liegen vor, Anästhesie hat zugestimmt.\nPostoperativ: Analgesie (Ibuprofen oder Paracetamol), Thromboseprophylaxe mit niedermolekularem Heparin, Mobilisation ab dem 1. postoperativen Tag, Beratung zur Raucherentwöhnung.']],
 kern:['Seit 3 Monaten Leistenschwellung links, jetzt Schmerzen, Übelkeit, nicht mehr reponierbar','Starker Raucher (37,5 py) mit chronischem Husten als Risikofaktor','Nicht reponierbare, druckschmerzhafte Vorwölbung links, Hoden unauffällig, Labor unauffällig','Sono: Darmschlingen im Bruchsack, keine Ischämie; Röntgen: kein Ileus, keine freie Luft','Verdachtsdiagnose inkarzerierte Leistenhernie links','Notfall-OP (TAPP) mit Aufklärung und Anästhesie; postoperativ Analgesie, Thromboseprophylaxe, Frühmobilisation, Rauchstopp'],
 qs:['Warum muss der Patient heute noch operiert werden?','Was ist der Unterschied zwischen TAPP und Lichtenstein?','Warum ist das Rauchen für die Operation relevant?']},
{id:'asthma',dx:'Asthma bronchiale',name:'Frau Lisa Meier',age:34,sex:'f',s:[
 ['Hergang','Vorstellung in der Notaufnahme nach nächtlicher Atemnot.'],
 ['Hauptsymptomatik','Nächtliche Atemnot, pfeifende Atmung, Engegefühl in der Brust. Häufige Hustenattacken, besonders morgens und bei körperlicher Belastung. Keine Infektzeichen.'],
 ['Vorgeschichte','Allergische Rhinitis (seit 2015), Neurodermitis in der Kindheit. Allergien: Pollen (Gräser, Birke). Nichtraucherin, lebt mit Katze.\nSozial: Lehrerin, verheiratet, 2 Kinder. Familie: Mutter Asthma, Vater Heuschnupfen.'],
 ['Vitalparameter bei Aufnahme','RR 115/75 mmHg, HF 88/min, AF 20/min, SpO₂ 92 % (Raumluft), Temperatur 36,8 °C.'],
 ['Körperliche Untersuchung','Verlängertes Exspirium mit Giemen über beiden Lungen. Unauffällig: Abdomen, Neurologie.'],
 ['Labor','Eosinophile 6 % (↑). Normwertig: Blutbild, CRP, Leber- und Nierenwerte.'],
 ['Apparative Diagnostik','Lungenfunktion: FEV1 68 % des Sollwerts, Tiffeneau-Index 65 %. Peak-Flow: 250 l/min (↓).'],
 ['Medikation','Bisher: Cetirizin 10 mg 1x täglich.\nNeu: Budesonid/Formoterol inhalativ 2-0-2, Salbutamol 200 µg inhalativ bei Bedarf.'],
 ['Stationärer Verlauf','SpO₂ unter 2 l/min O₂ stabilisiert, aktuell 96 %. Bisher keine erneuten Anfälle.'],
 ['Procedere','Weiterführung von Budesonid/Formoterol. Schulung zu Peak-Flow-Meter und Inhalator. Termin für allergologische Diagnostik und Asthmaschulung. Entlassung bei stabiler Symptomatik innerhalb von 48 Stunden.']],
 kern:['Nächtliche Dyspnoe, Giemen, thorakales Engegefühl, Husten morgens/bei Belastung','Atopie: allergische Rhinitis, Neurodermitis, Pollenallergie, Katze; familiäre Belastung','SpO₂ 92 %, verlängertes Exspirium mit Giemen beidseits','Eosinophilie 6 %, FEV1 68 %, Tiffeneau 65 %, Peak-Flow 250 l/min (obstruktiv)','Verdachtsdiagnose allergisches Asthma bronchiale (DD COPD, Infekt, kardial)','Therapie ICS/LABA 2-0-2, Salbutamol b. B., O₂ 2 l, Schulung, Allergologie, Entlassung in 48 h'],
 qs:['Wie beweisen Sie die Reversibilität der Obstruktion?','Was raten Sie der Patientin zur Katze?','Welche Asthmaschwere bzw. -kontrolle liegt vor?']},
{id:'diverti1',dx:'Akute unkomplizierte Sigmadivertikulitis',name:'Herr Thomas Becker',age:58,sex:'m',role:'Stationsarzt/-ärztin in der Viszeralchirurgie',sit:'Vorstellung eines über die Notaufnahme aufgenommenen Patienten bei der Chefarzt-Visite.',s:[
 ['Vorstellung','Kam mit seiner Ehefrau in die Notaufnahme. Seit 2 Tagen zunehmende Schmerzen im linken Unterbauch, Fieber bis 38,7 °C, reduzierter Appetit, kein Erbrechen, kein Stuhlverhalt. Der Hausarzt empfahl bei Tastschmerz die Vorstellung in der Klinik.'],
 ['Vorerkrankungen','Arterielle Hypertonie, chronische Obstipation, Z. n. Appendektomie (1989). Allergien: keine bekannt.'],
 ['Medikation bei Aufnahme','Ramipril 5 mg 1x täglich, Macrogol bei Bedarf, keine NSAR.'],
 ['Sozial- und Familienanamnese','Verheiratet, kaufmännischer Angestellter, Nichtraucher. Vater mit Divertikulitis, Mutter mit Kolonkarzinom.'],
 ['Vitalparameter','RR 128/78 mmHg, HF 88/min, AF 16/min, SpO₂ 97 % (Raumluft), Temperatur 38,3 °C.'],
 ['Körperliche Untersuchung','Druckschmerz im linken Unterbauch, leichte Abwehrspannung, keine Peritonitiszeichen, verminderte Darmgeräusche, keine tastbare Resistenz.'],
 ['Labor','Leukozyten 13.200/µl, CRP 78 mg/l, Hb 13,4 g/dl. Nieren-, Leberwerte und Amylase unauffällig.'],
 ['Bildgebung','CT-Abdomen mit Kontrastmittel: Wandverdickung des Sigmas, perikolische Entzündung, kein Abszess, keine freie Luft.'],
 ['Behandlung','Nahrungskarenz für 24–48 h, Flüssigkeit i.v. und Elektrolytausgleich, Ciprofloxacin 500 mg 2x täglich + Metronidazol 500 mg 3x täglich oral, Paracetamol bei Schmerzen.'],
 ['Verlauf','Fieber nach 48 h rückläufig, CRP sinkend, Kostaufbau ab Tag 3, beschwerdearm. Geplante Entlassung an Tag 5 mit ambulanter Kontrolle und ballaststoffreicher Ernährung.']],
 kern:['Linksseitige Unterbauchschmerzen seit 2 Tagen, Fieber 38,7 °C','Chronische Obstipation; Familie: Divertikulitis (Vater), Kolonkarzinom (Mutter)','Fieber 38,3 °C, Druckschmerz LUQ mit leichter Abwehrspannung, keine Peritonitis','Leukozytose 13.200, CRP 78; CT: Sigmawandverdickung, perikolische Entzündung, kein Abszess, keine freie Luft','Verdachtsdiagnose akute unkomplizierte Sigmadivertikulitis, DD (kompliziert, Kolonkarzinom, CED)','Therapie und Verlauf: Nahrungskarenz, i.v. Flüssigkeit, Cipro + Metronidazol, Kostaufbau, Entlassung Tag 5, Koloskopie im Intervall'],
 qs:['Wann sollte eine Koloskopie gemacht werden – gerade wegen der Mutter?','Was wäre eine komplizierte Divertikulitis?','Wann würden Sie operieren?']},
{id:'appabsz',dx:'Perforierte Appendizitis mit perityphlitischem Abszess',name:'Herr Lukas Brenner',age:24,sex:'m',role:'Stationsarzt/-ärztin in der Allgemeinchirurgie',sit:'Vorstellung eines Patienten mit akuten Unterbauchschmerzen bei der Chefarzt-Visite.',s:[
 ['Vorstellung','Kam selbstständig mit seiner Mutter in die Notaufnahme. Seit 2 Tagen diffuse Bauchschmerzen, die sich in den rechten Unterbauch verlagert haben. Zusätzlich Übelkeit, Fieber bis 38,9 °C, Appetitlosigkeit, kein Stuhlgang seit 24 Stunden.'],
 ['Vorerkrankungen','Keine bekannten Grunderkrankungen. Appendizitis in der Familie (Vater, Bruder). Allergien: keine bekannt.'],
 ['Medikation bei Aufnahme','Keine Dauermedikation, Ibuprofen 400 mg bei Bedarf (selbst).'],
 ['Sozialanamnese','Student, lebt in einer WG, Nichtraucher, gelegentlich Alkohol.'],
 ['Vitalparameter','RR 122/76 mmHg, HF 102/min, AF 20/min, SpO₂ 98 %, Temperatur 38,8 °C.'],
 ['Körperliche Untersuchung','Druckschmerz im rechten Unterbauch (McBurney-Punkt), Abwehrspannung, positiver Loslassschmerz, keine tastbare Resistenz, Darmgeräusche leicht reduziert.'],
 ['Labor','Leukozyten 15.800/µl, CRP 142 mg/l, Hb 13,9 g/dl, Kreatinin 0,9 mg/dl.'],
 ['Bildgebung','Sonographie: freie Flüssigkeit im rechten Unterbauch, Appendix nicht sicher darstellbar.\nCT-Abdomen: verdickte Appendix mit Wandunterbrechung, Abszess (4 cm), freie Flüssigkeit.'],
 ['Behandlung','Notfallmäßige laparoskopische Appendektomie mit Abszessdrainage. Piperacillin/Tazobactam 4,5 g i.v. alle 8 h. Metamizol 1 g i.v. alle 6 h.'],
 ['Verlauf','Stabiler postoperativer Verlauf, Fieberrückgang ab Tag 2, CRP rückläufig, Kostaufbau ab Tag 3, Drainageentfernung Tag 4. Entlassung nach 7 Tagen mit ambulanter Wundkontrolle beim Hausarzt.']],
 kern:['Schmerzwanderung von diffus in den rechten Unterbauch, Fieber 38,9 °C, Übelkeit, Inappetenz','Tachykardie 102, Fieber 38,8 °C, McBurney-Druckschmerz, Abwehrspannung, Loslassschmerz','Leukozytose 15.800, CRP 142','CT: perforierte Appendix mit 4-cm-Abszess und freier Flüssigkeit','Verdachtsdiagnose perforierte Appendizitis mit perityphlitischem Abszess (DD z. B. M. Crohn, Gastroenteritis)','Notfall-OP laparoskopisch mit Abszessdrainage, Pip/Taz, Metamizol; Verlauf und Entlassungsplanung'],
 qs:['Warum haben Sie zusätzlich ein CT gemacht?','Wie lange geben Sie das Antibiotikum?','Welche Komplikationen erwarten Sie postoperativ?']},
{id:'vkb1',dx:'Kreuzbandriss und Meniskusschaden',name:'Herr Heinrich Schmidt',age:25,sex:'m',s:[
 ['Vorstellungsgrund','Vorstellung in der Notaufnahme mit seiner Partnerin. Beim Fußball rechtes Knie nach innen geknickt, sofort Schmerzen und Schwellung. In den letzten Tagen zunehmende Beschwerden mit eingeschränkter Beweglichkeit. Begleitend: deutlich geschwollenes rechtes Knie, starke Schmerzen bei Bewegung und Berührung.'],
 ['Vorerkrankungen','Diabetes mellitus Typ 1 mit regelmäßiger Insulintherapie. Sonst keine.'],
 ['Körperliche Untersuchung','RR 126/82 mmHg, Puls 76/min, Temperatur 36,9 °C. Guter AZ, aber deutlich schmerzgeplagt. Lokal: auffällige Schwellung des rechten Knies, eingeschränkte Flexion und Extension, positiver Pivot-Shift-Test und vorderer Schubladentest (Kreuzbandinstabilität). Haut ohne Wunden.'],
 ['Diagnostik','Röntgen Knie: keine Fraktur.\nMRT Knie: Kreuzbandriss und Meniskusschaden.\nSonographie Knie: Flüssigkeitsansammlung und Schwellung.\nLabor: HbA1c 8 % (schwankend, Patient misst selbst), CRP 6 mg/l (leicht ↑).'],
 ['Behandlungsplan','Stationäre Aufnahme. Anpassung der Insulindosis wegen Stress und geplanter OP, regelmäßige Blutzuckerkontrollen. Ibuprofen 600 mg alle 6 Stunden.\nArthroskopische Kreuzbandplastik mit Gracilis-Sehne als Autograft (diagnostisch und therapeutisch, inkl. Meniskusversorgung).\nPostoperativ: Kühlung, Schonung, frühe Physiotherapie; Kontrolle von Blutzucker und Entzündungswerten.']],
 kern:['Valgus-Distorsionstrauma rechtes Knie beim Fußball, Schwellung, Schmerzen, Bewegungseinschränkung','DM Typ 1 mit HbA1c 8 % (schlecht eingestellt)','Erguss, positiver vorderer Schubladentest und Pivot-Shift-Test','Röntgen ohne Fraktur; MRT: (vorderer) Kreuzbandriss und Meniskusschaden','Verdachtsdiagnose VKB-Ruptur mit Meniskusläsion rechts','Therapie: Analgesie Ibuprofen 600 mg, Insulinanpassung, arthroskopische VKB-Plastik mit Gracilis-Autograft, Kühlung, Physiotherapie'],
 qs:['Wurde der Patient über die Arthroskopie und die Nachbehandlung aufgeklärt?','Worauf müssen Sie wegen des Diabetes perioperativ achten?','Warum nehmen Sie die Gracilis-Sehne?']},
{id:'pneu1',dx:'Pneumonie',name:'Frau Hannah Wagner',age:94,sex:'f',s:[
 ['Vorstellungsgrund','Vorstellung in der Rettungsstelle mit Fieber, produktivem Husten, Atemnot und starker Abgeschlagenheit.'],
 ['Vorgeschichte','Keine pulmonalen Vorerkrankungen, Diabetes mellitus Typ 2, arterielle Hypertonie.'],
 ['Körperliche Untersuchung','RR 137/85 mmHg, Puls 76/min, Temperatur 38,9 °C, SpO₂ 92 %, verminderter AZ, rechtsseitig feuchte Rasselgeräusche.'],
 ['Labor','CRP 86 mg/l ↑, Leukozyten 16.000/µl ↑.'],
 ['Bildgebung','Röntgen-Thorax: Infiltrat im rechten Oberlappen.'],
 ['Bisheriges Vorgehen','Stationäre Aufnahme. Amoxicillin/Clavulansäure i.v., Flüssigkeitssubstitution, 1 l O₂ über Nasenbrille, Antipyretika.'],
 ['Weiteres Vorgehen','Atemtherapie angemeldet, pulmonologisches Konsil. Bei Besserung der Beschwerden und Entfieberung: Fortsetzung der Antibiotikatherapie bis 2 Tage nach Besserung.']],
 kern:['Fieber, produktiver Husten, Dyspnoe, Abgeschlagenheit','DM Typ 2, Hypertonie, keine pulmonalen Vorerkrankungen; hohes Alter','Fieber 38,9 °C, SpO₂ 92 %, feuchte RGs rechts','CRP 86, Leukozytose 16.000, Infiltrat rechter Oberlappen','Verdachtsdiagnose ambulant erworbene Pneumonie rechter Oberlappen, DD Lungenödem, Lungenabszess','Therapie: Amoxicillin/Clavulansäure i.v., Volumen, O₂ 1 l, Antipyretika, Atemtherapie, Antibiose bis 2 Tage nach Besserung'],
 qs:['Wie schätzen Sie den Schweregrad ein – kennen Sie den CRB-65?','Warum Amoxicillin/Clavulansäure?','Wann stellen Sie auf orale Antibiotika um?']},
{id:'pneu2',dx:'Pneumonie (mit Arzneimittelreaktion)',name:'Frau Monika Schulz',age:58,sex:'f',s:[
 ['Vorstellungsgrund','Vorstellung in Begleitung ihres Ehemannes in der Notaufnahme: Luftnot, Husten mit grünem Auswurf, Abgeschlagenheit, Leistungsabfall, Fieber bis 39 °C.'],
 ['Vorgeschichte','Keine relevanten Vorerkrankungen. Allergien bisher nicht bekannt.'],
 ['Körperliche Untersuchung','Abgeschwächtes vesikuläres Atemgeräusch rechts, feuchte Rasselgeräusche und Bronchialatmen links apikal. Neurologisch leichte Verwirrtheit, sonst unauffällig.\nVitalzeichen bei Aufnahme: RR 100/70 mmHg, HF 105/min, AF 30/min, Temperatur 39,1 °C, SpO₂ 91 %.'],
 ['Labor','CRP ↑, Leukozyten 16.000/µl. Venöse BGA: pO₂ 34 mmHg (↓), pCO₂ 45 mmHg, pH 7,37. COVID- und Influenza-Test negativ.'],
 ['Bildgebung','Röntgen-Thorax: Verschattung im linken Oberlappen, positives Aerobronchogramm.'],
 ['Behandlung','Ampicillin/Sulbactam i.v. 1-0-1, 2 l O₂ (wenn SpO₂ < 95 %), Infusionstherapie.\nAuf Station feinfleckiger Hautausschlag; nach Absetzen von Ampicillin deutliche Besserung → Umstellung auf Levofloxacin i.v. 1-0-0.'],
 ['Aktueller Zustand','Allgemeine Besserung: RR 115/80 mmHg, HF 80/min, AF 20/min, SpO₂ 95 %, Temperatur 38,1 °C. Laborkontrolle morgen. Nach 5 Tagen i.v.-Antibiose Umstellung auf orale Therapie und ggf. Entlassung nach Hause oder in eine Rehaklinik.']],
 kern:['Dyspnoe, Husten mit grünem Auswurf, Fieber 39 °C, Leistungsabfall','Bei Aufnahme Hypotonie 100/70, Tachykardie 105, Tachypnoe 30, SpO₂ 91 %, Verwirrtheit','Bronchialatmen und RGs links apikal; Röntgen: Oberlappenverschattung links mit Aerobronchogramm','Leukozytose, venöse BGA, COVID/Influenza negativ','Arzneimittelexanthem unter Ampicillin/Sulbactam → Umstellung auf Levofloxacin; V. a. Penicillinallergie dokumentieren','Aktuell gebessert, Laborkontrolle, orale Umstellung nach 5 Tagen, Entlassung/Reha'],
 qs:['Wie hat sich die allergische Reaktion geäußert – hatte die Patientin einen anaphylaktischen Schock?','Haben Sie eine Blutgasanalyse durchgeführt?','Wann möchten Sie die Patientin entlassen?','Wie schwer war die Pneumonie bei Aufnahme (CRB-65)?']},
{id:'panzyto',dx:'Panzytopenie / Trizytopenie',name:'Herr Heinrich Schmidt',age:63,sex:'m',s:[
 ['Vorstellungsgrund','Überweisung durch den Hausarzt: Müdigkeit, Leistungsabfall, seit längerem Nasenbluten; Bewusstseinsverlust in der Garage.'],
 ['Vorgeschichte','Z. n. Schlaganfall 2013 bei Vorhofflimmern, Bluthochdruck. Check-up vor zwei Monaten altersgemäß unauffällig. Nichtraucher, trinkt wenig Alkohol, sportlich.'],
 ['Körperliche Untersuchung','RR 134/84 mmHg, Puls 84/min, Temperatur 37,8 °C, verminderter AZ, Blässe von Haut und Schleimhäuten, Blutkruste unterhalb des rechten Nasenlochs, Einblutungen am Oberkörper.\nUnauffällig: Herz, Lunge, Bauch (weich), Milz, Lymphknoten, Neurostatus.'],
 ['Labor (Hausarzt)','Hämoglobin ↓, MCV ↓, Erythrozyten ↓, Leukozyten ↓, Thrombozyten ↓, Entzündungsparameter ↑.\nUnauffällig: Urinstix, Sonographie.'],
 ['Bisherige Medikation','Eliquis (Apixaban) 5 mg 1-1-0 seit 2013 zur Blutverdünnung\nAmlodipin 5 mg 1-0-0'],
 ['Einweisung','Einweisung mit der Bitte um weitere Abklärung der Panzytopenie.']],
 kern:['Fatigue, Leistungsabfall, rezidivierende Epistaxis, Synkope','Z. n. Apoplex 2013 bei VHF unter Apixaban, Hypertonie','Subfebril 37,8 °C, Blässe, Petechien/Hämatome am Oberkörper, keine Splenomegalie/Lymphadenopathie','Verminderung aller drei Zellreihen (mikrozytäre Anämie, Leukopenie, Thrombozytopenie), Entzündungswerte ↑','Verdachtsdiagnose Panzytopenie unklarer Genese, DD hämatologische Neoplasie (Leukämie, Lymphom, MDS), Infektion','Procedere vorgeschlagen: großes Blutbild/Ausstrich, Umkehrisolation, Antikoagulation überprüfen, hämatologisches Konsil, Knochenmarkpunktion, Röntgen-Thorax'],
 qs:['Was ist eine Panzytopenie?','Was machen Sie mit dem Eliquis bei der Thrombozytopenie?','Warum soll der Patient isoliert werden?','Welche Untersuchung bringt die Diagnose?']},
{id:'nstemi1',dx:'Nicht-ST-Hebungs-Myokardinfarkt (NSTEMI)',name:'Herr Wolfgang Seidel',age:61,sex:'m',role:'Stationsarzt/-ärztin in der Kardiologie',sit:'Vorstellung eines über die Notaufnahme aufgenommenen Patienten bei der Chefarzt-Visite.',s:[
 ['Vorstellung','Kam mit seiner Ehefrau in die Notaufnahme wegen retrosternaler Schmerzen seit ca. 2 Stunden: dumpf-drückend, Ausstrahlung in den linken Arm, Übelkeit und Schweißausbruch. Bei Ankunft kreislaufstabil, aber weiterhin symptomatisch.'],
 ['Vorerkrankungen','Arterielle Hypertonie, Diabetes mellitus Typ 2 (seit 2015), Hyperlipidämie, Raucher (30 py). Allergien: keine bekannt.'],
 ['Medikation bei Aufnahme','Metformin 1000 mg 1-0-1, Ramipril 5 mg 1-0-0, Atorvastatin 20 mg abends, ASS 100 mg 1x täglich.'],
 ['Sozial- und Familienanamnese','Verheiratet, Busfahrer, lebt mit Ehefrau. Vater Herzinfarkt mit 58 Jahren.'],
 ['Vitalparameter','RR 105/65 mmHg, HF 88/min, AF 18/min, SpO₂ 95 % (Raumluft), Temperatur 36,7 °C.'],
 ['Körperliche Untersuchung','Herz rhythmisch, keine pathologischen Geräusche. Lunge vesikulär, keine Rasselgeräusche. Abdomen weich. Keine Ödeme.'],
 ['EKG','Sinusrhythmus, ST-Senkungen in V5–V6, keine ST-Hebungen.'],
 ['Labor','Troponin T initial 102 ng/l (Norm < 14), nach 3 h 162 ng/l. CK-MB erhöht. CRP 4,2 mg/l, HbA1c 7,1 %, Kreatinin 1,0 mg/dl.'],
 ['Behandlung','Heparin 5000 IE i.v. als Bolus, ASS 250 mg i.v. + Ticagrelor 180 mg oral (duale Plättchenhemmung), O₂ 2 l/min, Morphin 5 mg i.v. bei Bedarf.'],
 ['Verlauf','Stationäre Aufnahme, Monitoring auf der Überwachungsstation. Frühinvasive Koronarangiographie innerhalb von 24 Stunden, ggf. PCI. Später Reha und Sekundärprävention.']],
 kern:['Retrosternaler Druckschmerz seit 2 h mit Ausstrahlung linker Arm, Übelkeit, Diaphorese','Kardiovaskuläre Risikofaktoren: Hypertonie, DM 2, Hyperlipidämie, 30 py, positive Familienanamnese','EKG: ST-Senkungen V5–V6, keine Hebungen','Troponin-T-Dynamik 102 → 162 ng/l, CK-MB ↑','Verdachtsdiagnose NSTEMI, DD instabile AP, Lungenembolie, Aortendissektion','Therapie: Heparin, ASS + Ticagrelor, O₂, Morphin b. B., Monitoring, Koronarangiographie < 24 h'],
 qs:['Warum Koronarangiographie innerhalb von 24 Stunden und nicht sofort?','Woran unterscheiden Sie NSTEMI und instabile Angina pectoris?','Was machen Sie mit dem Metformin vor der Kontrastmittelgabe?']},
{id:'nstemi2',dx:'NSTEMI',name:'Frau Helga Wagner',age:60,sex:'f',s:[
 ['Vorstellungsgrund','Vorstellung in der Rettungsstelle mit seit gestern bestehenden thorakalen Schmerzen und Druckgefühl in der Brust, Ausstrahlung in linken Arm, Schulter und Kiefer. Atemnot, Schwindel, Übelkeit, Kaltschweißigkeit. Wach, ansprechbar, zu Ort, Zeit und Person orientiert.'],
 ['Vorgeschichte','Bluthochdruck, Diabetes mellitus Typ 2. Mutter hatte einen Herzinfarkt.'],
 ['Körperliche Untersuchung','RR 90/60 mmHg, Puls 140/min, Temperatur 37,8 °C, SpO₂ 95 %, 4. Herzton. Bauch weich. Milz, Lymphknoten und Neurostatus unauffällig.'],
 ['EKG','Sinustachykardie 140/min, keine ST-Hebungen, keine neuen ST-Senkungen in zwei benachbarten Ableitungen.'],
 ['Labor','Leukozyten ↑ (16.000/µl), Troponin I und T ↑, CK-MB ↑.'],
 ['Bisheriges Vorgehen','Stationäre Aufnahme, Therapie nach (modifiziertem) MONA-Schema: Morphin, Sauerstoff, Nitrat, ASS sowie Heparin und Betablocker. Der Blutdruck hat sich gebessert.'],
 ['Weiteres Vorgehen','Kardiologisches Konsil, Koronarangiographie in den nächsten 72 Stunden empfohlen, Patientin wurde aufgeklärt.']],
 kern:['Thoraxschmerz seit gestern mit Ausstrahlung linker Arm/Schulter/Kiefer, Dyspnoe, Übelkeit, Kaltschweiß','Hypertonie, DM 2, positive Familienanamnese','Hypotonie 90/60, Tachykardie 140, S4','EKG ohne ST-Hebung; Troponin I/T und CK-MB erhöht','Verdachtsdiagnose NSTEMI, DD instabile AP, Myokarditis, Perikarditis','MONA + Heparin + Betablocker, kardiologisches Konsil, Koronarangiographie < 72 h, Aufklärung erfolgt'],
 qs:['Würden Sie bei einem Blutdruck von 90/60 Nitrat geben?','Warum geben Sie einen Betablocker bei Hypotonie – ist das sinnvoll?','Ist die Patientin über die Koronarangiographie aufgeklärt?']},
{id:'vhf1',dx:'Neu diagnostiziertes Vorhofflimmern mit tachykarder Überleitung',name:'Herr Karl Brenner',age:75,sex:'m',role:'Stationsarzt/-ärztin in der Kardiologie',sit:'Vorstellung eines Patienten mit Palpitationen und Dyspnoe bei der Chefarzt-Visite.',s:[
 ['Vorstellung','Vom Hausarzt mit Verdacht auf Herzrhythmusstörung eingewiesen, begleitet von seiner Tochter. Seit 3 Tagen Herzklopfen, Luftnot bei Belastung (Treppensteigen), leichte Thoraxbeschwerden. Keine Synkope, kein Schwindel.'],
 ['Vorerkrankungen','Arterielle Hypertonie (seit 2002), Hypercholesterinämie, Z. n. TIA (2018), Gicht. Allergien: keine bekannt.'],
 ['Medikation bei Aufnahme','Amlodipin 5 mg morgens, Simvastatin 20 mg abends, Allopurinol 100 mg 1x täglich. Keine Antikoagulation.'],
 ['Sozial- und Familienanamnese','Verwitwet, lebt allein, mobil, Nichtraucher. Vater Myokardinfarkt, Mutter Vorhofflimmern.'],
 ['Vitalparameter','RR 135/90 mmHg, HF 132/min (unregelmäßig), AF 20/min, SpO₂ 94 % (Raumluft), Temperatur 36,8 °C.'],
 ['Körperliche Untersuchung','Unregelmäßiger Herzschlag, keine Herzgeräusche, periphere Pulse tastbar, keine Ödeme. Lunge vesikulär, keine Rasselgeräusche. Neurologisch unauffällig.'],
 ['EKG','Vorhofflimmern mit absoluter Arrhythmie, Frequenz 130–140/min, keine ST-Veränderungen.'],
 ['Echokardiographie','Gute LV-Funktion (EF 58 %), linker Vorhof dilatiert (4,7 cm), keine Klappenpathologie.'],
 ['Labor','TSH normal, NT-proBNP 630 pg/ml, Kalium 4,3 mmol/l, Kreatinin 1,1 mg/dl, Troponin negativ.'],
 ['Behandlung','Frequenzkontrolle mit Metoprolol i.v. (5 mg, 3x im Abstand von 5 min), dann Metoprolol retard 47,5 mg 1-0-1. Antikoagulation mit Apixaban 5 mg 2x täglich (CHA₂DS₂-VASc-Score 4). Aufklärung zur Dauertherapie.'],
 ['Verlauf','HF nach 24 h unter 90/min, asymptomatisch, hämodynamisch stabil. Ambulante Vorstellung zur Rhythmuskontrolle (Kardioversion diskutiert). Entlassung an Tag 4 mit Arztbrief und Medikationsplan.']],
 kern:['Palpitationen, Belastungsdyspnoe, leichte Thoraxbeschwerden seit 3 Tagen, keine Synkope','Hypertonie, Z. n. TIA, keine Antikoagulation','HF 132/min arrhythmisch, SpO₂ 94 %','EKG: VHF mit absoluter Arrhythmie; Echo: EF 58 %, LA dilatiert; TSH normal, Troponin negativ, NT-proBNP ↑','Verdachtsdiagnose neu diagnostiziertes tachykardes VHF, CHA₂DS₂-VASc 4','Frequenzkontrolle Metoprolol, Antikoagulation Apixaban, Rhythmuskontrolle ambulant, Entlassung Tag 4'],
 qs:['Wie kommen Sie auf einen CHA₂DS₂-VASc-Score von 4?','Warum haben Sie das TSH bestimmt?','Würden Sie jetzt sofort kardiovertieren – was bräuchten Sie vorher?']},
{id:'ugib',dx:'Untere gastrointestinale Blutung (V. a. Divertikelblutung)',name:'Herr Klaus Berger',age:68,sex:'m',s:[
 ['Vorstellungsgrund','Heute früh durch den Rettungsdienst gebracht. Seit gestern Abend mehrfach blutiger Stuhl mit hellrotem, beigemischtem Blut. Begleitend leichter Schwindel und Schwäche.'],
 ['Vorgeschichte','Arterielle Hypertonie, bekannte Divertikulose des Kolons, keine bekannte Gerinnungsstörung.'],
 ['Medikation','Ramipril 5 mg 1x täglich\nASS 100 mg 1x täglich'],
 ['Klinischer Befund','Blass, hämodynamisch stabil, RR 125/75 mmHg, Puls 92/min, afebril. Abdomen weich, leicht druckempfindlich im linken Unterbauch. Rektal: blutige Spur.'],
 ['Labor','Hb 10,1 g/dl (vor 3 Monaten 13,6 g/dl), Hkt 32 %, INR 1,1, CRP 3 mg/l.'],
 ['Verdachtsdiagnose','Divertikelblutung des Kolons (wahrscheinlich Sigmadivertikel).'],
 ['Geplante Maßnahmen','Stationäre Aufnahme, Volumentherapie, Kontrolle von Vitalparametern und Hb, Koloskopie zur Lokalisation der Blutungsquelle und ggf. interventionellen Blutstillung.']],
 kern:['Hämatochezie (hellrotes Blut) seit gestern Abend, Schwindel, Schwäche','Divertikulose, Hypertonie, ASS-Einnahme','Blässe, stabil (RR 125/75, HF 92), Druckschmerz LUQ, Blut rektal','Hb-Abfall 13,6 → 10,1 g/dl, INR normal, CRP normal','Verdachtsdiagnose Divertikelblutung, DD Angiodysplasie, Kolonkarzinom, Hämorrhoiden, obere GI-Blutung','Procedere: stationär, Volumen, Hb-Kontrollen, Blutgruppe/Kreuzblut, ASS pausieren, Koloskopie mit ggf. Blutstillung'],
 qs:['Wie schließen Sie eine obere GI-Blutung aus?','Was machen Sie mit dem ASS?','Ab welchem Hb würden Sie transfundieren?']},
{id:'anaphy',dx:'Anaphylaktischer Schock',name:'Herr Stefan Müller',age:45,sex:'m',s:[
 ['Vorstellungsgrund','Vorstellung nach einem Bienenstich. Laut Angehörigen kurz nach dem Stich Schwellung von Gesicht und Zunge, starke Atemnot, generalisierter Juckreiz und Hautrötung. Synkope vor Ort, ausgeprägtes Schwächegefühl. Notdienst sofort verständigt.'],
 ['Vorgeschichte','Seit einem Jahr psychologische Therapie wegen Depression, keine aktuelle Medikation. Bekannte Allergie gegen Bienenstiche, bisher keine schweren Reaktionen. Verheiratet, Ingenieur, kinderlos. Mutter: Heuschnupfen.'],
 ['Körperliche Untersuchung','RR 110/70 mmHg, Puls 110/min, AF 26/min, Temperatur 36,2 °C, SpO₂ 93 % vor O₂-Gabe. Zeichen eines schweren anaphylaktischen Schocks: wach, neurologisch verlangsamt, aber allseits orientiert.\nHNO: ausgeprägtes Zungenödem, Stridor. Haut: generalisierte Urtikaria, konjunktivale Injektion.\nLunge: Dyspnoe mit verlängertem Exspirium, gelegentlich Giemen.\nKreislauf: Tachykardie, periphere Kältezeichen, abgeschwächte Pulse.'],
 ['Labor','CRP leicht ↑, Tryptase ↑ (Bestätigung der Anaphylaxie), Leukozytose. BGA: Hypoxämie ohne Hyperkapnie. Elektrolyte und Nierenwerte unauffällig, Troponin negativ.'],
 ['Bildgebung','Röntgen-Thorax: unauffällig, kein Lungenödem, kein Pneumothorax.\nEKG: Sinustachykardie, keine ST-Veränderungen.\nSonographie Abdomen: unauffällig.'],
 ['Notfallmaßnahmen','Adrenalin 0,5 mg i.m., Clemastin 2 mg i.v., Prednisolon 250 mg i.v., O₂ 6 l/min über Maske, Ringer-Lösung 1000 ml i.v.'],
 ['Weiteres Vorgehen','Aufnahme auf die Intensivstation: kontinuierliches Monitoring von Atmung und Kreislauf, Echokardiographie (Ausschluss kardiogener Schock), weitere Volumengabe, Urin-/Nierenkontrolle.\nNach Stabilisierung Verlegung auf die internistische Normalstation. Vor Entlassung Schulung zum Adrenalin-Autoinjektor (Notfallset).']],
 kern:['Bienenstich mit Angioödem (Gesicht, Zunge), Dyspnoe, Pruritus, Urtikaria, Synkope','Bekannte Bienengiftallergie; Depression ohne Medikation','Tachykardie 110, Tachypnoe 26, SpO₂ 93 %, Stridor, Giemen, periphere Kältezeichen','Tryptase ↑, Hypoxämie; Röntgen und EKG ohne Pathologie','Verdachtsdiagnose anaphylaktischer Schock (Grad III) nach Insektenstich','Adrenalin 0,5 mg i.m., Antihistaminikum, Prednisolon, O₂, Volumen, ITS-Monitoring, Notfallset und Schulung, ggf. Hyposensibilisierung'],
 qs:['Warum geben Sie Adrenalin intramuskulär und nicht intravenös?','Wie lange überwachen Sie den Patienten – Stichwort biphasische Reaktion?','Was bekommt der Patient bei Entlassung mit?','Kommt eine Hyposensibilisierung in Frage?']},
{id:'ogib',dx:'Obere gastrointestinale Blutung',name:'Herr Dieter König',age:74,sex:'m',s:[
 ['Vorstellungsgrund','Vorstellung in der Notaufnahme mit seit zwei Tagen wiederholtem schwarzem, übelriechendem Stuhl. Zunehmende Müdigkeit, Abgeschlagenheit und Schwindel, besonders beim Aufstehen. Übelkeit, kein Erbrechen.'],
 ['Vorgeschichte','Arterielle Hypertonie, koronare Herzkrankheit (dauerhaft ASS 100 mg täglich), Z. n. Gastroduodenitis vor 5 Jahren. Keine bekannten Allergien. Nichtraucher, gelegentlich Alkohol.'],
 ['Körperliche Untersuchung','Blasse Haut und Schleimhäute. RR 110/65 mmHg, HF 99/min, SpO₂ 96 % (Raumluft), Temperatur 36,7 °C. Abdomen weich, kein Druckschmerz, keine Flankenschmerzen. Digital-rektale Untersuchung: Teerstuhl, Hämoccult positiv.'],
 ['Labor','Hb 7,9 g/dl, Hkt 25 %, MCV normozytär, CRP 10 mg/l (leicht ↑), Leukozyten 11.000/µl. Elektrolyte und Gerinnung unauffällig.'],
 ['Behandlung','Stationäre Aufnahme. Pantoprazol 80 mg i.v. als Bolus, danach kontinuierlich über Perfusor. Flüssigkeitssubstitution, Nahrungskarenz. Erythrozytenkonzentrate vorbereitet (bei Hb < 8 g/dl).'],
 ['Weiteres Vorgehen','Ösophagogastroduodenoskopie heute Nachmittag. Aktuell stabil, weiterhin Kreislaufmonitoring.']],
 kern:['Meläna seit 2 Tagen, Fatigue, orthostatischer Schwindel, Übelkeit','KHK mit Dauer-ASS, Z. n. Gastroduodenitis','Blässe, RR 110/65, HF 99, Teerstuhl bei DRU, Hämoccult positiv','Anämie Hb 7,9 g/dl, Hkt 25 %, Gerinnung normal','Verdachtsdiagnose obere GI-Blutung, a. e. Ulkusblutung unter ASS, DD Varizen, Mallory-Weiss, Tumor','Pantoprazol 80 mg Bolus + Perfusor, Volumen, Nahrungskarenz, EK bei Hb < 8, ÖGD heute, Monitoring'],
 qs:['Würden Sie bei einem Hb von 7,9 transfundieren?','Was machen Sie mit dem ASS bei bekannter KHK?','Wann muss die ÖGD spätestens erfolgen?','Kennen Sie einen Score zur Risikoeinschätzung?']},
{id:'humerus',dx:'Humerusschaftfraktur',name:'Herr Thomas Müller',age:30,sex:'m',s:[
 ['Vorstellungsgrund','Vorstellung in der Notaufnahme nach Fahrradsturz direkt auf den rechten Arm. Sofort starke, stechende Schmerzen im rechten Oberarm, bei Bewegung deutlich verstärkt; Arm kann nicht bewegt werden. Sichtbare Schwellung und Hämatom. Taubheitsgefühl, Kribbeln in der Hand, Schwindel und Atemnot verneint.'],
 ['Vorgeschichte','Allergisches Asthma bronchiale, allergische Rhinitis. Allergie: Penicillin.'],
 ['Medikation','Keine regelmäßige Medikation, Asthmaspray bei Bedarf.'],
 ['Körperliche Untersuchung','Stabiler AZ, schmerzgeplagt. RR 125/80 mmHg, HF 84/min, AF 16/min, Temperatur 36,9 °C, SpO₂ 98 % (Raumluft). Rechter Oberarm: sichtbare Fehlstellung und Schwellung, Druckschmerz, Bewegungseinschränkung, keine offene Wunde. Peripherer Puls und Sensibilität der Hand unauffällig.'],
 ['Bildgebung','Röntgen: dislozierte Fraktur im mittleren Drittel des Humerus ohne Gelenkbeteiligung.'],
 ['Behandlungsplan','Sofortige Ruhigstellung mit Oberarmschiene, Schmerztherapie mit Metamizol. Stationäre Aufnahme. Operative Versorgung durch Plattenosteosynthese. Postoperativ Thromboseprophylaxe und Physiotherapie.']],
 kern:['Fahrradsturz auf den rechten Arm, Schmerzen, Schwellung, Hämatom, Funktionsverlust','Allergisches Asthma, Penicillinallergie (wichtig für perioperative Antibiose)','Fehlstellung, DMS intakt (Puls, Sensibilität; Radialisfunktion prüfen)','Röntgen: dislozierte Humerusschaftfraktur (mittleres Drittel) ohne Gelenkbeteiligung','Verdachtsdiagnose geschlossene dislozierte Humerusschaftfraktur rechts','Ruhigstellung, Metamizol, stationär, Plattenosteosynthese, Thromboseprophylaxe, Physiotherapie'],
 qs:['Welcher Nerv ist bei einer Humerusschaftfraktur besonders gefährdet – wie prüfen Sie ihn?','Welches Antibiotikum geben Sie perioperativ bei Penicillinallergie?','Wäre auch eine konservative Therapie möglich?']},
{id:'osg',dx:'Sprunggelenkfraktur',name:'Frau Anna Müller',age:35,sex:'f',s:[
 ['Vorstellungsgrund','Überweisung durch den Hausarzt nach Sportunfall: beim Joggen mit dem linken Fuß umgeknickt, danach starke Schmerzen und Schwellung, im Verlauf schlechter. Vorstellung in Begleitung ihres Ehemannes. Knirschen im Gelenk, eingeschränkte Beweglichkeit.'],
 ['Vorgeschichte','Allergisches Asthma. Familie: Vater Myokardinfarkt, Mutter rheumatoide Arthritis und Asthma bronchiale.'],
 ['Bisherige Medikation','Hexoral-Spray bei Bedarf, Ibuprofen 600 mg bei Bedarf.'],
 ['Körperliche Untersuchung','RR 120/80 mmHg, Puls 78/min, Temperatur 36,5 °C, AZ unauffällig. Linkes Sprunggelenk: Ödem, Schmerzen bei Berührung und Bewegung, Krepitation. Keine Wunden, keine Durchblutungsstörung.'],
 ['Bildgebung','Röntgen: Sprunggelenkfraktur links ohne Dislokation.'],
 ['Labor','Entzündungsparameter, Hb, Leukozyten, Thrombozyten und Elektrolyte im Normbereich.'],
 ['Behandlungsplan','Stationäre Aufnahme. Ibuprofen alle 6 Stunden. Operation am Folgetag: ORIF (offene Reposition und interne Fixation).\nPostoperativ: Ruhigstellung, regelmäßige Laborkontrollen, Überwachung der Entzündungsparameter, schrittweise Mobilisation mit Physiotherapie. Allergisches Asthma und familiäre kardiovaskuläre Belastung werden berücksichtigt.']],
 kern:['Supinationstrauma links beim Joggen, Schmerzen, Ödem, Krepitation, Bewegungseinschränkung','Allergisches Asthma (Vorsicht mit NSAR!); Familienanamnese','Vitalparameter unauffällig, DMS intakt, keine offene Wunde','Röntgen: nicht dislozierte Sprunggelenkfraktur links; Labor unauffällig','Verdachtsdiagnose Sprunggelenkfraktur links (z. B. Außenknöchelfraktur)','ORIF am Folgetag, Analgesie, Hochlagerung/Kühlung, Thromboseprophylaxe, Physiotherapie'],
 qs:['Warum operieren Sie eine nicht dislozierte Fraktur?','Ist Ibuprofen bei allergischem Asthma unproblematisch?','Welche Thromboseprophylaxe planen Sie?']},
{id:'appkompl',dx:'Komplizierte Appendizitis',name:'Frau Berna Sabin',age:21,sex:'f',s:[
 ['Vorstellungsgrund','Vorstellung in der Rettungsstelle mit seit gestern Abend diffusen Bauchschmerzen, die heute in den rechten Unterbauch gewandert sind. Seit heute Morgen Fieber, Abgeschlagenheit, Übelkeit, Appetitlosigkeit, Schüttelfrost. Heute nur einen Schluck Wasser getrunken.'],
 ['Vorgeschichte','Heuschnupfen (allergische Rhinitis). Schwangerschaft ausgeschlossen.'],
 ['Körperliche Untersuchung','RR 150/100 mmHg, Puls 86/min, Temperatur 38,7 °C, SpO₂ 99 %. Druckschmerz über dem Lanz-Punkt, Blumberg-, Rovsing- und Psoas-Zeichen positiv. Urinkontrolle unauffällig.'],
 ['Sonographie','Kokardenphänomen, verdickte Wand, Appendix über 9 mm, wenig intraabdominelle freie Flüssigkeit.'],
 ['Labor','CRP 12 mg/dl ↑, Leukozyten 16.000/µl ↑.'],
 ['Bisherige Medikation','Medroxyprogesteron (Spritze alle 3 Monate).'],
 ['Behandlung','Metamizol i.v. 3x täglich, Ampicillin/Sulbactam i.v. 3x täglich.'],
 ['Weiteres Vorgehen','Stationäre Aufnahme, Patientin stabil, Vitalparameter aktuell im Normbereich. Aufklärung über laparoskopische Appendektomie (unterschrieben), Termin beim Anästhesisten vereinbart, Eltern vor 2 Stunden informiert.']],
 kern:['Schmerzwanderung periumbilikal/diffus → rechter Unterbauch, Fieber, Übelkeit, Inappetenz, Schüttelfrost','Nüchternheit: nur ein Schluck Wasser heute; Schwangerschaft ausgeschlossen','Fieber 38,7 °C, Hypertonie 150/100, Lanz-Punkt, Blumberg, Rovsing, Psoas positiv','Sono: Kokarde, Appendix > 9 mm, Wandverdickung, freie Flüssigkeit; CRP und Leukozyten erhöht','Verdachtsdiagnose komplizierte Appendizitis, DD Divertikulitis/Adnexitis, Extrauteringravidität ausgeschlossen','Metamizol + Ampicillin/Sulbactam, laparoskopische Appendektomie aufgeklärt, Anästhesie, Angehörige informiert'],

{id:'vhf2',dx:'Vorhofflimmern',name:'Frau Sara Schmidt',age:53,sex:'f',s:[
 ['Vorstellungsgrund','Vorstellung in der Rettungsstelle mit Attacken von Schwindel, Herzklopfen und Bewusstseinsverlust; erneute Attacke nach einer Stunde mit gleichem Verlauf. Sturz nach Gleichgewichtsunsicherheit. Begleitend Zittern, Schweißausbrüche, Übelkeit und Erbrechen. Aktuell beschwerdefrei.'],

{id:'vhf3',dx:'Vorhofflimmern',name:'Frau Dilara Sahin',age:69,sex:'f',s:[
 ['Vorstellungsgrund','Vorstellung in Begleitung ihrer Tochter. Morgens sei noch alles in Ordnung gewesen; am Nachmittag klagte die Mutter über Schwindel und Herzrasen, dann Bewusstseinsverlust mit Sturz. Bei Aufnahme Gangunsicherheit und Desorientierung zu Ort und Zeit.'],
 ['Vorgeschichte','Diabetes mellitus Typ 2, Bluthochdruck, Morbus Parkinson, COPD GOLD II.'],

 ['Labor','Blut entnommen, Befunde stehen noch aus.'],
 ['Bisherige Medikation','Metformin 1000 mg 1-0-0\nRamipril 5 mg 1-0-0\nSalbutamol-Inhalation bei Bedarf'],

{id:'diverti2',dx:'Divertikulitis',name:'Frau Natalia Volpe',age:69,sex:'f',role:'Assistenzarzt/-ärztin der Inneren Medizin in der ZNA',s:[
 ['Vorstellungsgrund','Überweisung durch den Hausarzt, in Begleitung der Tochter: seit einigen Tagen krampfartige Bauchschmerzen im linken Unterbauch, körperliche Schwäche und Müdigkeit. Bei den letzten Toilettengängen dunkelroter Stuhl mit Blutspuren (beunruhigt die Patientin sehr). Seit zwei Monaten abwechselnd Durchfall und Verstopfung.'],

 ['Körperliche Untersuchung','Beim Hausarzt 38,5 °C. Im Krankenhaus: RR 130/86 mmHg, Puls 83/min, Temperatur 38,6 °C, verminderter AZ, übergewichtiger EZ. Abdomen deutlich druckschmerzhaft, leicht tastbare walzenförmige Resistenz, spärliche Darmgeräusche. Haut blass.\nUnauffällig: Herz, Lunge, Milz, Lymphknoten, Neurostatus.'],
 ['Labor','Hämoglobin ↓, Erythrozyten ↓, Leukozyten ↑, Thrombozyten ↓, Entzündungsparameter ↑.'],

 ['Behandlung und Plan','Stationäre Aufnahme. Intravenöse Antibiotikatherapie, Analgesie, Flüssigkeitszufuhr. Vorbereitung auf eine mögliche Operation bei Verschlechterung. Bluttransfusion bei starkem Blutverlust.']],

async function aiChat(messages,opts={}){
  const ext=opts.signal;
  if(!hasGemini()){const r=await groqChat(messages,opts);showProvider('Groq');return r}
  if(hasGroq()&&Date.now()<geminiPauseUntil){
    try{const r=await groqChat(messages,opts);showProvider('Groq');return r}catch(e){if(e&&e.name==='AbortError')throw e}
  }
  if(!hasGroq()){const r=await geminiChat(messages,opts);showProvider('Gemini');return r}

  const onExt=()=>ctrl.abort();if(ext){if(ext.aborted)ctrl.abort();else ext.addEventListener('abort',onExt,{once:true})}

    const r=await groqChat(messages,opts);showProvider('Groq');return r;
  }
  finally{clearTimeout(to);if(ext)ext.removeEventListener('abort',onExt)}
}
async function groqChat(messages,{json=false,signal,fast=false}={}){
  const msgs=[];
  const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
  if(sys)msgs.push({role:'system',content:sys+(json?'\nAntworte ausschließlich mit gültigem JSON.':'')});
  for(const m of messages.filter(m=>m.role!=='system')){const r=m.role==='assistant'?'assistant':'user';const l=msgs[msgs.length-1];
    if(l&&l.role===r)l.content+='\n'+m.content;else msgs.push({role:r,content:m.content})}
  if(!msgs.length||msgs[msgs.length-1].role==='system')msgs.push({role:'user',content:'(Gespräch beginnt)'});
  if(json&&!sys)msgs.unshift({role:'system',content:'Antworte ausschließlich mit gültigem JSON.'});
  let lastErr;
  for(const model of GROQ_MODELS){
    const body={model,messages:msgs,temperature:json?0.3:0.8,max_completion_tokens:fast?900:8000};
    if(json)body.response_format={type:'json_object'};
    if(/gpt-oss/.test(model)){body.reasoning_effort='low';body.include_reasoning=false}else body.reasoning_format='hidden';
    let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+String(cfg.groq).trim()},body:JSON.stringify(body)});
    let d=await r.json().catch(()=>({}));
    if(!r.ok&&r.status===400&&/reason/i.test((d.error&&d.error.message)||'')){
      delete body.reasoning_effort;delete body.include_reasoning;delete body.reasoning_format;
      r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+String(cfg.groq).trim()},body:JSON.stringify(body)});
      d=await r.json().catch(()=>({}));
    }
    if(r.ok){
      let text=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
      text=text.replace(/<think>[\s\S]*?<\/think>/g,'').trim();
      if(text)return {text,provider:'Groq',model};
      lastErr=new Error('Groq: leere Antwort');continue;
    }
    lastErr=new Error('Groq: '+((d.error&&d.error.message)||('HTTP '+r.status)));lastErr.status=r.status;lastErr.groq=true;
    if([404,413,429,498,500,503].includes(r.status)||(r.status===400&&/model/i.test(lastErr.message)))continue;
    break;
  }
  throw lastErr;
}
async function geminiChat(messages,{json=false,signal,fast=false,think}={}){

    }
    if(r.ok){if(!fast&&main.includes(model)&&model!==cfg.model){cfg.model=model;saveCfg()}lastErr=null;break}
    lastErr=new Error((d.error&&d.error.message)||('HTTP '+r.status));lastErr.status=r.status;
    if(r.status===404||r.status===429||r.status===503)continue;
    break;
  }
  if(lastErr)throw lastErr;
  const c=d.candidates&&d.candidates[0];
  const text=c&&c.content&&c.content.parts?c.content.parts.filter(p=>!p.thought).map(p=>p.text||'').join(''):'';
  if(!text&&c&&c.finishReason&&c.finishReason!=='STOP'){const e=new Error('Antwort blockiert ('+c.finishReason+')');throw e}
  return {text};
}
function errText(e){
  if(!e)return 'Fehler';
  if(e.groq){if(e.status===401)return L('Groq-Schlüssel ungültig','Invalid Groq key');if(e.status===429||e.status===413)return L('Groq-Limit kurz erreicht – 1 Minute warten','Groq limit reached for now – wait 1 minute');return e.message}
  if(e instanceof TypeError&&/fetch/i.test(e.message))return L('Verbindung fehlgeschlagen (Internet oder Browser blockiert den Zugriff)','Connection failed (internet, or the browser blocks the request)');
  if(e.status===400&&/key/i.test(e.message)||e.status===401||e.status===403)return L('API-Schlüssel ungültig','Invalid API key');
  if(e.status===429)return L('Kostenloses Limit kurz erreicht – 1 Minute warten','Free limit reached for now – wait 1 minute');
  if(e.status===404||/model/i.test(e.message))return L('Modell nicht gefunden – Modellname in den Einstellungen prüfen','Model not found – check the model name on the start page');
  return L('Verbindung gestört: ','Connection problem: ')+e.message;
}
function germanVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));
  const want=S&&S.c&&S.c.sex==='f'?/(female|anna|petra|katja|hedda|marlene|vicki|helena|google deutsch)/i:/(male|markus|yannick|stefan|conrad|hans|google deutsch)/i;
  return vs.find(v=>want.test(v.name))||vs.find(v=>/google/i.test(v.name))||vs[0]||null;
}
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
function talking(on){const av=$('svg.av');if(av)av.classList.toggle('talking',on)}
let keepU=[],sayId=0;
function browserSpeak(text,done){
  let fin=false;const finish=()=>{if(fin)return;fin=true;clearTimeout(S.safety);talking(false);done()};
  const fake=()=>{talking(true);clearTimeout(S.mt);S.mt=setTimeout(()=>safe(),Math.min(12000,Math.max(1500,text.length*65)))};
  const busyVoice=()=>window.speechSynthesis&&(speechSynthesis.speaking||speechSynthesis.pending);
  const t0=Date.now(),maxMs=Math.max(8000,text.length*140);
  const safe=()=>{if(fin)return;if(busyVoice()&&Date.now()-t0<maxMs){S.safety=setTimeout(safe,500);return}finish()};
  S.safety=setTimeout(safe,Math.max(6000,text.length*120));
  if(!window.speechSynthesis){fake();return}
  const ss=speechSynthesis;
  const go=()=>{
    const parts=(text.match(/[^.!?…]+[.!?…]*/g)||[text]).map(p=>p.trim()).filter(Boolean);
    keepU=parts.map((p,i)=>{
      const u=new SpeechSynthesisUtterance(p);u.lang='de-DE';const v=germanVoice();if(v)u.voice=v;
      u.pitch=S.c.sex==='f'?1.1:0.85;u.rate=1;
      u.onstart=()=>{S.spoke=true;talking(true)};
      u.onend=u.onerror=()=>{if(i===parts.length-1)finish()};
      return u});
    S.spoke=false;keepU.forEach(u=>ss.speak(u));
    clearTimeout(S.chk);S.chk=setTimeout(()=>{if(!S.spoke&&S.view==='call'&&!fin&&!busyVoice()){fake();setStatus(L('Keine Stimme? Lautstärke prüfen oder Chrome/Edge nutzen','No voice? Check the volume or use Chrome/Edge'))}},1800);
  };
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,150)}else{ss.resume();go()}
}
function speak(text,done){stopVoice();const id=++sayId;browserSpeak(text,()=>{if(id===sayId&&done)done()})}
function stopVoice(){sayId++;try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}if(audio){try{audio.pause()}catch(e){}audio=null}if(S){clearTimeout(S.safety);clearTimeout(S.mt);clearTimeout(S.chk)}talking(false)}

/* rooms: fixed shuffled pairings (same on every device). Each room = Test A (Anamnese) → 1 min break → Test B (Aufklärung) */
function seeded(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  clock=setInterval(tick,1000);tick();

function tick(){
  if(!S||S.view!=='call')return;

function setStatus(s){const e=$('#st');if(e)e.textContent=s}
function showDraft(){const t=$('#txt');if(t)t.value=(S.buf+' '+(S.partial||'')).trim()}
function micUI(){
  const m=$('#mic');if(!m||!S)return;
  m.innerHTML=S.hf?MIC:MICOFF;m.classList.toggle('on',S.hf&&S.phase==='idle');m.classList.toggle('wait',S.hf&&(S.phase==='speaking'||S.phase==='thinking'));m.classList.toggle('muted',!S.hf);
  m.setAttribute('aria-label',S.hf?L('Mikrofon stumm schalten','Mute microphone'):L('Mikrofon einschalten','Unmute microphone'));
  $('#self')?.classList.toggle('live',S.hf&&S.phase==='idle');
  if(S.phase==='thinking')setStatus(S.c.anrede+L(' überlegt…',' is thinking…'));

  else if(S.kind==='pv'&&!S.qStarted)setStatus(S.c.anrede+(S.awaitAns?L(' wartet auf Ihre Antwort',' is waiting for your answer'):L(' hört zu – stellen Sie den Fall vor',' is listening – present the case')));
  else setStatus(L('Ich höre zu – sprechen Sie','Listening – speak now'));

function voiceBusy(){return window.speechSynthesis&&(speechSynthesis.speaking||speechSynthesis.pending)}
const norm=t=>String(t||'').toLowerCase().replace(/[^a-zäöüß ]/g,' ').split(/\s+/).filter(w=>w.length>2);
function isEcho(t){const last=[...S.msgs].reverse().find(m=>m.who==='pat');if(!last)return false;const a=norm(t),b=new Set(norm(last.text));if(a.length<2)return false;return a.filter(w=>b.has(w)).length/a.length>=0.7}
function listen(){
  if(!SR||!S||S.view!=='call'||!S.hf||S.busy||S.phase==='speaking'||S.phase==='thinking'||S.recOn)return;
  if(voiceBusy()&&!S.bcOn){if(!S.vbSince)S.vbSince=Date.now();
    if(Date.now()-S.vbSince<1500){clearTimeout(S.lw);S.lw=setTimeout(listen,300);return}
    try{speechSynthesis.cancel()}catch(e){}}
  S.vbSince=0;
  const since=Date.now()-(S.lastVoiceEnd||0);if(since<450){clearTimeout(S.lw);S.lw=setTimeout(listen,450-since);return}
  S.startedAt=Date.now();
  S.buf='';S.partial='';S.sending=false;
  rec=new SR();rec.lang='de-DE';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let fin='',part='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else part+=t}
    if(fin)S.buf=(S.buf+' '+fin).trim();S.partial=part;showDraft();
    clearTimeout(S.sil);S.sil=setTimeout(()=>{if(S.recOn&&(S.buf||S.partial)){S.sending=true;try{rec.stop()}catch(err){S.recOn=false;sendBuf()}}},S.kind!=='anam'?2000:1300)};
  rec.onerror=e=>{
    const er=e.error;if(er==='no-speech'||er==='aborted')return;
    let msg='';
    if(er==='not-allowed'||er==='service-not-allowed')msg=L('Mikrofon nicht erlaubt – bitte im Browser erlauben (Schloss-Symbol in der Adresszeile) oder tippen.','Microphone not allowed – allow it in the browser (lock icon in the address bar), or type.');
    else if(er==='network')msg=IS_BRAVE?BRAVE_MSG():L('Die Spracherkennung ist nicht erreichbar. Bitte Chrome oder Edge verwenden (Internet nötig) – oder tippen.','Speech recognition is not reachable. Please use Chrome or Edge (needs internet) – or type.');
    else if(er==='audio-capture')msg=L('Kein Mikrofon gefunden oder von einer anderen App belegt (z. B. Zoom/Teams). Bitte prüfen – oder tippen.','No microphone found, or it is used by another app (e.g. Zoom/Teams). Please check – or type.');
    else if(er==='language-not-supported')msg=L('Deutsche Spracherkennung wird in diesem Browser nicht unterstützt – bitte Chrome oder Edge.','German speech recognition is not supported in this browser – please use Chrome or Edge.');
    if(msg){S.hf=false;S.recErr=er;$('#hint').textContent=msg;$('#hint').classList.add('warn');micUI()}};
  rec.onend=()=>{S.recOn=false;clearTimeout(S.sil);
    if(S.sending){S.sending=false;sendBuf();return}
    const quick=Date.now()-(S.startedAt||0)<1500;S.fails=quick?(S.fails||0)+1:0;
    const wait=S.fails>2?Math.min(4000,600*S.fails):300;
    micUI();if(S.hf&&S.view==='call'&&S.phase==='idle'){clearTimeout(S.lw);S.lw=setTimeout(listen,wait)}};
  try{rec.start();S.recOn=true;S.phase='idle'}catch(e){S.recOn=false}
  micUI();
}
function sendBuf(){
  const t=(S.buf+' '+(S.partial||'')).trim();S.buf='';S.partial='';const tx=$('#txt');if(tx)tx.value='';
  if(t&&!isEcho(t)&&!(S.kind!=='anam'&&isFiller(t)))doctorSays(t);else listen();
}
function stopListening(){clearTimeout(S&&S.sil);clearTimeout(S&&S.lw);if(rec&&S&&S.recOn){S.sending=false;try{rec.abort()}catch(e){}}if(S)S.recOn=false}
function micClick(){

function aufRoute(text){

  if(S.qStarted)return {mode:isQ?'answer_q':'questions'};
  if(isQ)return {mode:'answer'};

function patientInput(){

- Beantworte nur genau das, was gefragt wird. Erzähle nichts ungefragt (Ausnahme: die Hauptbeschwerde, wenn nach dem Grund des Besuchs gefragt wird, und die MOMENTE unten).
- Bei medizinischen Fachbegriffen, die ein Laie nicht kennt (z. B. Dyspnoe, Hämoptysen, Miktion, Defäkation, Noxen, Analgetika, Synkope, Emesis, Diarrhö, Obstipation, Palpitationen, Antikoagulation), fragst du nach, was das bedeutet.

- Steht etwas nicht im Fall, antworte unauffällig und plausibel (meist "Nein" / "Nicht dass ich wüsste") und bleib konsistent.

- Wenn der Arzt die nächsten Schritte erklärt oder sich verabschiedet, stell deine offene Frage aus den MOMENTEN (falls noch nicht gestellt); danach bedankst du dich kurz.
FALL:
${c.story}
MOMENTE (jeweils nur einmal, an passender Stelle, natürlich eingebaut):
${c.cues}`;
  const arr=[{role:'system',content:sys}];

async function savePDF(){
  const b=$('#pdf');const t=b.textContent;b.disabled=true;b.textContent='PDF wird erstellt…';
  const d=ST.date||new Date(),ev=S.ev;
  const slug=x=>String(x).replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,'-').replace(/^-|-$/g,'');
  const name=`FaMed_${slug(ST.label)}_${[ev.has.a?slug(ST.a.title):'',ev.has.b?slug(ST.b.t):'',ev.has.c?slug(ST.pc.dx.split(' (')[0]):'',ev.has.d?slug(ST.pd.dx.split(' (')[0]):''].filter(Boolean).slice(0,4).join('_').slice(0,120)}_${d.toISOString().slice(0,10)}.pdf`;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
    window.scrollTo(0,0);
    await html2pdf().set({margin:[12,10,12,10],filename:name,image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(pdfHTML(ev),'string').save();
  }catch(e){
    try{window.print()}catch(err){}
  }
  b.disabled=false;b.textContent=t;
}

/* ---------- new version available? (GitHub Pages caches the page up to 10 min) ---------- */
const APP_VERSION='2026-11-23c';
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/APP_VERSION='([^']+)'/);
    if(!m||m[1]===APP_VERSION||document.getElementById('upd'))return;
    document.body.insertAdjacentHTML('beforeend',`<div id="upd" style="position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:60;background:#0b5d63;color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;font-size:15px">${L('Neue Version der Seite verfügbar.','A new version of the site is available.')}<button class="btn sm" style="margin:0;background:#fff;color:#0b5d63" id="updb">${L('Jetzt neu laden','Reload now')}</button></div>`);
    document.getElementById('updb').onclick=()=>{if(S&&S.view==='call'&&!confirm(L('Der laufende Test wird abgebrochen. Trotzdem neu laden?','The running test will be cancelled. Reload anyway?')))return;location.replace(location.pathname+'?v='+m[1])};
  }catch(e){}
}
setTimeout(checkUpdate,4000);setInterval(checkUpdate,5*60*1000);
nav();home();
}
